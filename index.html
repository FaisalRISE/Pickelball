<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Prime Time × Munchilicious — Team Event</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#15111f; --ink2:#1b1529; --surface:#221a34; --raised:#2c2242; --line:#3a2e56; --lineL:#4c3d70;
  --text:#f4eeff; --muted:#a498c4; --dim:#6f6291;
  --amber:#ffd166; --amberD:#e0a92e; --accentInk:#ffd166;
  --mint:#06d6a0; --mintD:#04a87e; --mintInk:#06d6a0;
  --rose:#ef476f; --roseInk:#ff8fa5;
  --onAccent:#221a34;
  --court:#1d4f7a; --courtAlt:#17608a; --kitchen:#c2632f; --courtLine:rgba(255,255,255,.72);
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --r:14px;
}
html[data-theme="light"]{
  --ink:#ffffff; --ink2:#f7f5fb; --surface:#ffffff; --raised:#f2eff8; --line:#e4dff0; --lineL:#cec5e2;
  --text:#191330; --muted:#5d5480; --dim:#8b82a8;
  --amber:#ffc94d; --amberD:#e9ac1f; --accentInk:#8a6100;
  --mint:#12c79a; --mintD:#0a9c77; --mintInk:#04795c;
  --rose:#e03a63; --roseInk:#b81f45;
  --onAccent:#2a2018;
  --court:#2f74a8; --courtAlt:#2b86ba; --kitchen:#d1793f; --courtLine:rgba(255,255,255,.9);
  --shadow:0 8px 22px rgba(40,25,80,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--ink);color:var(--text);
  font-family:'Manrope',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  min-height:100vh;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
html[data-theme="dark"] body{background:
  radial-gradient(1100px 520px at 88% -8%, rgba(6,214,160,.07), transparent 60%),
  radial-gradient(900px 480px at -8% 4%, rgba(255,209,102,.06), transparent 58%), var(--ink)}
.anton{font-family:'Anton','Arial Narrow',Impact,sans-serif;font-weight:400}
.wrap{max-width:1060px;margin:0 auto;padding:0 15px 120px}

header{position:sticky;top:0;z-index:60;background:var(--ink2);border-bottom:1px solid var(--line)}
.hd{max-width:1060px;margin:0 auto;padding:11px 15px;display:flex;align-items:center;gap:10px}
.mark{width:42px;height:42px;border-radius:12px;flex-shrink:0;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--amber),var(--mint));color:#221a34;font-family:'Anton',sans-serif;font-size:20px}
.hd h1{margin:0;font-size:15px;font-weight:800;line-height:1.1}
.hd .sub{font-size:9.5px;color:var(--muted);letter-spacing:.13em;text-transform:uppercase;margin-top:3px}
.hd .spacer{margin-left:auto}
.iconbtn{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:7px 9px;cursor:pointer;
  color:var(--muted);display:flex;align-items:center;gap:4px;font-family:inherit;font-size:10px;font-weight:800}
.iconbtn:hover{color:var(--text);border-color:var(--lineL)}
.iconbtn.on{background:color-mix(in srgb,var(--mint) 16%,transparent);border-color:var(--mint);color:var(--mintInk)}

nav.tabs{position:sticky;bottom:0;z-index:60;background:var(--ink2);border-top:1px solid var(--line)}
.tabs-in{max-width:1060px;margin:0 auto;display:flex;justify-content:space-around;padding:6px 0 env(safe-area-inset-bottom,7px)}
.tabBtn{flex:1;background:none;border:none;color:var(--dim);font-family:inherit;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px}
.tabBtn svg{width:20px;height:20px}
.tabBtn span{font-size:9px;font-weight:800}
.tabBtn.active{color:var(--accentInk)}

h2.sec{font-family:'Anton',sans-serif;font-size:27px;margin:20px 0 3px;text-transform:uppercase}
.lead{color:var(--muted);font-size:12.5px;margin:0 0 15px;line-height:1.55}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font-family:inherit;cursor:pointer;
  border-radius:10px;font-weight:800;font-size:12.5px;padding:10px 16px;border:1px solid var(--line);
  background:transparent;color:var(--muted)}
.btn:hover{border-color:var(--lineL);color:var(--text)}
.btn.primary{background:linear-gradient(135deg,var(--amber),var(--amberD));color:var(--onAccent);border:none}
.btn.sm{padding:6px 12px;font-size:11px;border-radius:8px}
.btn.ghost{background:var(--raised)}
.btn.danger{color:var(--roseInk);border-color:transparent;background:color-mix(in srgb,var(--rose) 14%,transparent)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.muted{color:var(--muted)}.dim{color:var(--dim)}
.label{font-size:9px;text-transform:uppercase;letter-spacing:.13em;color:var(--dim);font-weight:800}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:10.5px;font-weight:800;white-space:nowrap}
.tdot{width:11px;height:11px;border-radius:3px;flex-shrink:0}
.table-scroll{overflow-x:auto}

/* ---------- referee console ---------- */
.refhead{display:flex;align-items:center;gap:10px;margin:16px 0 12px}
.scorestrip{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin-bottom:11px}
.sTeam{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;position:relative;overflow:hidden}
.sTeam .stripe{position:absolute;top:0;left:0;right:0;height:3px}
.sTeam .nm{font-size:11.5px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sTeam .num{font-family:'Anton',sans-serif;font-size:52px;line-height:1;margin-top:2px}
.sTeam.right{text-align:right}
.combinedBox{text-align:center;padding:0 4px}
.combinedBox .cv{font-family:'Anton',sans-serif;font-size:30px;color:var(--mintInk);line-height:1}
.combinedBox .cl{font-size:8px;color:var(--dim);font-weight:800;letter-spacing:.1em;text-transform:uppercase}

.court{position:relative;display:grid;grid-template-columns:1fr 6px 1fr;border-radius:16px;overflow:hidden;
  box-shadow:var(--shadow);border:3px solid var(--courtLine);margin-bottom:11px;user-select:none}
.half{display:grid;grid-template-rows:1fr 1fr;background:var(--court);position:relative}
.half.b{background:var(--courtAlt)}
.net{background:repeating-linear-gradient(0deg,rgba(255,255,255,.95) 0 5px,rgba(255,255,255,.35) 5px 10px)}
.kitchen{position:absolute;top:0;bottom:0;width:19%;background:color-mix(in srgb,var(--kitchen) 78%,transparent);z-index:1}
.half.a .kitchen{right:0;border-left:2px solid var(--courtLine)}
.half.b .kitchen{left:0;border-right:2px solid var(--courtLine)}
.box{position:relative;z-index:2;padding:14px 13px 24px;min-height:104px;display:flex;flex-direction:column;
  justify-content:center;gap:5px;cursor:pointer}
.half .box:first-child{border-bottom:2px solid var(--courtLine)}
.box:hover{background:rgba(255,255,255,.09)}
.box:active{background:rgba(255,255,255,.17)}
.box.locked{cursor:default}.box.locked:hover{background:transparent}
.ball{display:inline-flex;flex-shrink:0}
.ball svg{filter:drop-shadow(0 1px 3px rgba(0,0,0,.5))}
.servetag{font-size:8.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#fff59d;margin-top:2px}
.tossbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;padding:10px 13px;margin-bottom:11px}
.posTag{font-size:8.5px;font-weight:800;letter-spacing:.11em;color:rgba(255,255,255,.75);text-transform:uppercase}
.pSlot{display:flex;align-items:center;gap:6px;min-width:0}
.pSlot .sl{font-family:'Anton',sans-serif;font-size:13px;color:#ffe6a3;flex-shrink:0}
.pSlot .pn{font-size:15px;font-weight:800;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.5);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pPool{font-size:8px;font-weight:800;padding:1px 5px;border-radius:4px;background:rgba(255,255,255,.24);color:#fff;flex-shrink:0}
.box.justin{box-shadow:inset 0 0 0 3px var(--mint)}
.taphint{position:absolute;bottom:5px;left:0;right:0;text-align:center;font-size:8.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px;
  color:rgba(255,255,255,.6);letter-spacing:.07em;text-transform:uppercase;z-index:3;pointer-events:none}

.ctrls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:11px}
.ctrlrow{display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;padding:9px}
.ctrlrow .tl{flex:1;min-width:0;font-size:11px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--raised);
  color:var(--text);font-family:'Anton',sans-serif;font-size:19px;cursor:pointer;flex-shrink:0}
.rbtn.plus{border:none}
.rbtn:disabled{opacity:.35;cursor:not-allowed}

.rotwrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:11px}
.rothead{display:flex;align-items:baseline;gap:9px;margin-bottom:11px;flex-wrap:wrap}
.rothead .big{font-family:'Anton',sans-serif;font-size:21px;color:var(--accentInk)}
.ladder{display:flex;gap:3px}
.gate{flex:1;min-width:0}
.gate .bar{height:32px;border-radius:7px;background:var(--raised);border:1px solid var(--line);overflow:hidden;position:relative}
.gate .fill{position:absolute;inset:0;width:0;background:linear-gradient(90deg,color-mix(in srgb,var(--amber) 55%,transparent),var(--amber));transition:width .25s}
.gate.done .fill{width:100%}
.gate.cur .bar{border-color:var(--amber);box-shadow:0 0 0 2px color-mix(in srgb,var(--amber) 22%,transparent)}
.gate .pair{position:absolute;inset:0;display:grid;place-items:center;font-size:10px;font-weight:800;color:var(--muted);z-index:2}
.gate.done .pair{color:var(--onAccent)}
.gate.cur .pair{color:var(--text)}
.gate .tick{text-align:center;font-size:9px;color:var(--dim);font-weight:800;margin-top:4px}
.gate.cur .tick{color:var(--accentInk)}
.submodal{position:fixed;inset:0;z-index:200;background:rgba(10,6,20,.72);backdrop-filter:blur(4px);
  display:flex;align-items:center;justify-content:center;padding:18px}
.subcard{background:var(--surface);border:2px solid var(--mint);border-radius:20px;padding:22px;max-width:460px;width:100%;
  box-shadow:0 24px 70px rgba(0,0,0,.5);text-align:center}
.subgate{font-family:'Anton',sans-serif;font-size:23px;color:var(--mintInk);text-transform:uppercase}
.subcard.ends{border-color:var(--amber)}
.subgate.ends{color:var(--accentInk)}
.btn.mintbtn.amberbtn{background:linear-gradient(135deg,var(--amber),var(--amberD));color:var(--onAccent)}
.subpair{font-size:12.5px;font-weight:800;color:var(--muted);margin:2px 0 14px}
.subrow{background:var(--raised);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:9px;text-align:left}
.subteam{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:800;color:var(--muted);margin-bottom:7px}
.subswap{display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-size:13px;font-weight:700}
.subswap .tag{font-size:8px;font-weight:800;letter-spacing:.1em;padding:2px 5px;border-radius:4px;margin-right:5px}
.subswap .off{color:var(--dim)}
.subswap .off .tag{background:color-mix(in srgb,var(--rose) 18%,transparent);color:var(--roseInk)}
.subswap .on{color:var(--text)}
.subswap .on .tag{background:color-mix(in srgb,var(--mint) 20%,transparent);color:var(--mintInk)}
.subswap .on b{color:var(--mintInk)}
.subswap .arrow{color:var(--dim);display:flex}
.btn.mintbtn{width:100%;margin-top:6px;background:linear-gradient(135deg,var(--mint),var(--mintD));color:#08251d;
  border:none;padding:14px;font-size:14px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:8px;
  font-family:inherit;font-weight:800;cursor:pointer}
.subnote{font-size:10.5px;color:var(--dim);font-weight:700;margin-top:9px}
.alertbar{border-radius:12px;padding:12px 14px;font-weight:800;font-size:12.5px;margin-bottom:10px;
  display:flex;align-items:center;gap:9px;animation:pulse 1.3s ease-in-out infinite}
.alertbar.amber{background:color-mix(in srgb,var(--amber) 18%,transparent);border:1px solid var(--amber);color:var(--accentInk)}
.alertbar.gold{background:color-mix(in srgb,var(--rose) 15%,transparent);border:1px solid var(--rose);color:var(--roseInk)}
.endsnote{display:flex;align-items:center;justify-content:space-between;gap:9px;font-size:10.5px;font-weight:800;
  color:var(--dim);margin:-4px 0 11px;flex-wrap:wrap}
.endsnote>span{display:flex;align-items:center;gap:6px}
.subalert{margin-top:10px;border-radius:11px;padding:12px 13px;font-weight:800;font-size:12.5px;line-height:1.55;
  background:color-mix(in srgb,var(--mint) 13%,transparent);border:1px solid var(--mint);color:var(--mintInk);
  display:flex;align-items:flex-start;gap:9px;animation:pulse 1.3s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.countdown{margin-top:10px;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px}
.countdown b{color:var(--accentInk);font-family:'Anton',sans-serif;font-size:17px}
.winbanner{background:color-mix(in srgb,var(--amber) 15%,transparent);border:1px solid var(--amber);
  border-radius:16px;padding:18px;text-align:center;margin-bottom:12px}
.winbanner .wn{font-family:'Anton',sans-serif;font-size:26px;margin-top:4px}

.mrow{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:9px;cursor:pointer}
.mrow:hover{border-color:var(--lineL)}
.mrow .side{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.mrow .side.b{flex-direction:row-reverse;text-align:right}
.mrow .nm{font-weight:700;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .sc{font-family:'Anton',sans-serif;font-size:21px;min-width:32px;text-align:center}
.roundtag{font-size:9.5px;color:var(--dim);font-weight:800;text-transform:uppercase;letter-spacing:.12em;margin:18px 0 8px}

.team-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.rhead{padding:12px 14px;display:flex;align-items:center;gap:9px;border-bottom:1px solid var(--line)}
.rhead .tn{font-family:'Anton',sans-serif;font-size:16px}
.rrow{display:flex;align-items:center;gap:9px;padding:7px 14px;border-bottom:1px solid var(--line)}
.rrow:last-child{border-bottom:none}
.rrow .nm{font-size:12.5px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pool{font-size:8.5px;font-weight:800;padding:2px 6px;border-radius:5px;flex-shrink:0;width:26px;text-align:center}
.pool.C{background:color-mix(in srgb,var(--amber) 22%,transparent);color:var(--accentInk)}
.pool.P1{background:rgba(107,168,255,.2);color:#2a6fc9}
.pool.P2{background:rgba(199,146,234,.2);color:#7b3fa8}
.pool.G{background:rgba(244,99,168,.2);color:#c02a78}
html[data-theme="dark"] .pool.P1{color:#9cc6ff}
html[data-theme="dark"] .pool.P2{color:#d7b4f2}
html[data-theme="dark"] .pool.G{color:#f8c4dd}
.rname{flex:1;min-width:0;padding:7px 9px;background:var(--ink2);border:1px solid var(--line);border-radius:8px;
  color:var(--text);font-size:12.5px;font-family:inherit;outline:none}
.rname:focus{border-color:var(--amber)}

.lu-row{display:flex;align-items:center;gap:9px;padding:6px 0}
.lu-slot{font-family:'Anton',sans-serif;font-size:15px;color:var(--accentInk);width:26px;flex-shrink:0}
select.lu{flex:1;min-width:0;padding:9px 10px;background:var(--ink2);border:1px solid var(--line);border-radius:9px;
  color:var(--text);font-size:12.5px;font-family:inherit;outline:none;cursor:pointer}
.valbox{margin-top:10px;padding:10px 12px;border-radius:10px;font-size:11.5px;line-height:1.5}
.valbox.ok{background:color-mix(in srgb,var(--mint) 11%,transparent);border:1px solid color-mix(in srgb,var(--mint) 40%,transparent);color:var(--mintInk)}
.valbox.warn{background:color-mix(in srgb,var(--rose) 11%,transparent);border:1px solid color-mix(in srgb,var(--rose) 40%,transparent);color:var(--roseInk)}

table.stand{width:100%;border-collapse:collapse}
table.stand th{font-size:9px;text-transform:uppercase;letter-spacing:.09em;color:var(--dim);font-weight:800;
  text-align:center;padding:9px 5px;border-bottom:1px solid var(--line)}
table.stand th.l,table.stand td.l{text-align:left}
table.stand td{padding:11px 5px;text-align:center;border-bottom:1px solid var(--line);font-size:12.5px}
table.stand tr:last-child td{border-bottom:none}
.rank{width:25px;height:25px;border-radius:8px;display:inline-grid;place-items:center;font-family:'Anton',sans-serif;font-size:13px}
.tname{font-weight:700;display:flex;align-items:center;gap:8px}
.pts{font-family:'Anton',sans-serif;font-size:18px}

.rule-block{margin-bottom:16px}
.rule-block h3{font-family:'Anton',sans-serif;font-size:15px;margin:0 0 7px;color:var(--accentInk);text-transform:uppercase}
.rule-block ul{margin:0;padding-left:17px;color:var(--muted);font-size:12.5px;line-height:1.75}
.rule-block li b{color:var(--text)}
.seq{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.seqitem{background:var(--raised);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:11px;font-weight:700}
.seqitem b{color:var(--accentInk);font-family:'Anton',sans-serif}
.empty{text-align:center;padding:34px 16px;color:var(--dim);font-size:12.5px}
.empty .ic{font-size:30px;opacity:.35;margin-bottom:8px}

@media(max-width:680px){
  .team-grid{grid-template-columns:1fr}
  .ctrls{grid-template-columns:1fr}
  .sTeam .num{font-size:40px}
  .box{min-height:96px;padding:11px 9px 22px}
  .kitchen{width:14%}
  .pSlot .pn{font-size:13px}
  .gate .pair{font-size:8px}
  .subcard{padding:18px 15px}
  .subgate{font-size:19px}
  .subswap{flex-direction:column;align-items:flex-start;gap:6px}
  .subswap .arrow{transform:rotate(90deg);margin-left:14px}
  .btn.mintbtn{font-size:13px;padding:13px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header><div class="hd">
  <div class="mark">PT</div>
  <div><h1>Prime Time × Munchilicious</h1><div class="sub">Team Event · Chitrakoot · 9 Aug</div></div>
  <div class="spacer"></div>
  <button class="iconbtn" id="themeBtn"></button>
  <button class="iconbtn" id="lockBtn"></button>
</div></header>

<div class="wrap" id="app"></div>
<nav class="tabs"><div class="tabs-in" id="tabbar"></div></nav>

<script>
/* ==================================================================
   PRIME TIME x MUNCHILICIOUS - Team Event
   Single file, works offline, auto-saves to this browser
   ================================================================== */

const TARGET=51, GATE=15, SQUAD=6;
const POOLS=[{key:'C',n:1},{key:'P1',n:2},{key:'P2',n:2},{key:'G',n:1}];

// Rosters from the team-list poster; order follows the DRAWS poster
// (first four = Group 1, last four = Group 2). In a match, A1-A6 is the player rotation order.
const DEFAULT_TEAMS=[
 // Group 1
 {id:'t1',grp:'1',pos:1,name:"Rao's Paltan",    hex:'#ffd166',ink:'#a06a00',captain:'Tarang',
  p1:['Aum','Devang'],     p2:['Veer','Saurabh Rathi'], g:'Pooja'},
 {id:'t2',grp:'1',pos:2,name:'Munchilicious',   hex:'#ef476f',ink:'#b81f45',captain:'Himanshu',
  p1:['Ravi','Alok'],      p2:['Gulshan','Aditya'],     g:'Divya'},
 {id:'t3',grp:'1',pos:3,name:'Pickleboys',      hex:'#6ba8ff',ink:'#1f5fb8',captain:'Arsh',
  p1:['Ishaan','Azim'],    p2:['Ayush','Harshil'],      g:'Karishma'},
 {id:'t4',grp:'1',pos:4,name:'Dabbang Dinkers', hex:'#06d6a0',ink:'#06795c',captain:'Rohan',
  p1:['Nirbhay','Justin'], p2:['Sarthak','Kunal D'],    g:'Romi'},
 // Group 2

    return Object.assign({},t,{players});

const teamById=id=>TEAMS.find(t=>t.id===id);
const playerById=id=>{for(const t of TEAMS){const p=t.players.find(x=>x.id===id);if(p)return p;}return null;};

// ---- Rotation engine: the combined score is the clock ----
const segOf=c=>c<=0?0:Math.floor((c-1)/GATE);
const curSeg=c=>segOf(c+1);                 // segment the NEXT rally belongs to
const pairIdx=c=>{const s=curSeg(c)%SQUAD;return [s,(s+1)%SQUAD];};
const nextGateAt=c=>(Math.floor(c/GATE)+1)*GATE;
const subDueNow=c=>c>0&&c%GATE===0;
const pairLabel=c=>pairIdx(c).map(i=>'A'+(i+1)).join(' + ');
// ---- Court positions + serve, derived from the rally log ----
// Server serves from the RIGHT when their team's score is EVEN, LEFT when ODD.
// Serving team wins the rally -> its two players swap sides, same player serves on.
// Receiving team wins -> side-out, no swap; whoever stands in the parity box serves next.
// A substitute takes the slot of the player they replace.
function courtState(m){
  const fa=!!(m.flip&&m.flip[m.a]), fb=!!(m.flip&&m.flip[m.b]);
  const slot={}; slot[m.a]={R:fa?1:0,L:fa?0:1}; slot[m.b]={R:fb?1:0,L:fb?0:1};
  let serving=m.server||'a'; const score={a:0,b:0}; let lastSub=null;
  (m.log||[]).forEach(w=>{
    const tid=(w==='a')?m.a:m.b, wasServing=(serving===w);
    score[w]++;
    if(wasServing){const s=slot[tid],t=s.R;s.R=s.L;s.L=t;}
    else serving=w;
    const c=score.a+score.b;
    if(c%GATE===0){
      const seg=c/GATE, leave=((seg-1)%SQUAD+SQUAD)%SQUAD, enter=(seg+1)%SQUAD;
      [m.a,m.b].forEach(t2=>{const s2=slot[t2];
        if(s2.R===leave)s2.R=enter; else if(s2.L===leave)s2.L=enter;});
      lastSub={at:c,leave:leave,enter:enter};
    }
  });
  return {slot:slot,serving:serving,score:score,lastSub:lastSub};
}
const servingBox=(cs,key)=>(cs.score[key]%2===0)?'R':'L';
// A substitution gate that has NOT yet been acknowledged by the referee.
function subPending(m){
  if(!lineupReady(m)||isOver(m))return null;
  const c=scoreOf(m).c;
  if(c===0||c%GATE!==0)return null;
  return ((m.acked||[]).indexOf(c)>=0)?null:c;
}
// The change-of-ends at SWITCH_AT, until the referee confirms it.
function endsPending(m){
  if(!lineupReady(m)||isOver(m))return false;
  const s=scoreOf(m);
  return Math.max(s.a,s.b)>=SWITCH_AT && !m.endsAcked;
}
// If points are undone below a gate, that gate must be confirmed again.
function pruneAcks(m){
  const s=scoreOf(m);
  m.acked=(m.acked||[]).filter(g=>g<=s.c);
  if(Math.max(s.a,s.b)<SWITCH_AT) m.endsAcked=false;
}

const RR4=[[0,1],[2,3],[0,2],[1,3],[0,3],[1,2]];
const CROSS=[[0,7],[3,4],[1,6],[2,5]];   // Rao's v Dink Floyd, Dabbang v Airavat, Munchi v Pickleboss, Pickleboys v Leo's
const SWITCH_AT=25;                       // change ends when a team reaches this
const GOLDEN_AT=50;                       // 50-50 => golden point
function buildFixtures(){
  const ms=[]; const mk=(a,b,stage,round,extra)=>{
    const m={id:'m'+(ms.length+1),a:a,b:b,stage:stage,round:round,lineup:{},flip:{},log:[]};
    return Object.assign(m,extra||{});};
  const G=[[0,1,2,3],[4,5,6,7]];
  G.forEach((idx,gi)=>{RR4.forEach(pr=>
    ms.push(mk(TEAMS[idx[pr[0]]].id,TEAMS[idx[pr[1]]].id,'league','Group '+(gi+1),{grp:String(gi+1)})));});
  CROSS.forEach((pr,i)=>ms.push(mk(TEAMS[pr[0]].id,TEAMS[pr[1]].id,'league','Cross-Group Matches',{cross:i+1})));
  ms.push(mk(null,null,'third','3rd Place Play-off',{slot:'3RD'}));
  ms.push(mk(null,null,'final','Final',{slot:'F'}));
  return ms;
}

const isOver=m=>winnerOf(m)!==null;
const lineupReady=m=>!!(m.a&&m.b&&m.lineup&&m.lineup[m.a]&&m.lineup[m.b]
  &&m.lineup[m.a].length===SQUAD&&m.lineup[m.b].length===SQUAD
  &&m.lineup[m.a].every(Boolean)&&m.lineup[m.b].every(Boolean));

// Qualification is NOT group-wise: all 8 teams are ranked together on points scored,
// then point difference. Wins are shown for information but are not a ranking criterion.
function standings(){
  const acc={}; TEAMS.forEach(t=>{acc[t.id]={team:t,p:0,w:0,l:0,pf:0,pa:0};});
  state.matches.forEach(m=>{
    if(m.stage!=='league'||!m.a||!m.b||!acc[m.a]||!acc[m.b])return;
    const s=scoreOf(m),win=winnerOf(m);
    acc[m.a].pf+=s.a;acc[m.a].pa+=s.b;acc[m.b].pf+=s.b;acc[m.b].pa+=s.a;
    if(win){acc[m.a].p++;acc[m.b].p++;
      if(win===m.a){acc[m.a].w++;acc[m.b].l++;}else{acc[m.b].w++;acc[m.a].l++;}}
  });
  return Object.keys(acc).map(k=>{const r=acc[k];r.diff=r.pf-r.pa;return r;})
    .sort((x,y)=>y.pf-x.pf||y.diff-x.diff||y.w-x.w);
}
const leagueDone=()=>state.matches.filter(m=>m.stage==='league').every(isOver);
function setPair(m,a,b){if(m.a===a&&m.b===b)return;m.a=a;m.b=b;m.lineup={};m.flip={};m.log=[];}
function syncKnockout(){
  const f=x=>state.matches.find(m=>m.slot===x);
  const fin=f('F'),third=f('3RD'); if(!fin||!third)return;
  if(!leagueDone())return;
  const r=standings();
  if(!isOver(fin))setPair(fin,r[0].team.id,r[1].team.id);
  if(!isOver(third))setPair(third,r[2].team.id,r[3].team.id);
}

function refConsole(m){
  const a=teamById(m.a),b=teamById(m.b);
  const s=scoreOf(m),c=s.c,over=isOver(m),win=winnerOf(m);
  const due=subDueNow(c)&&!over, toGate=nextGateAt(c)-c;

  // score panels, court halves and the +/- rows — follows the same left/right order,
  // so the referee always taps the side the team is physically standing on.
  const ends=Math.max(s.a,s.b)>=SWITCH_AT;
  const baseLeftIsA=((m.startLeft||m.a)===m.a);          // which team the referee allocated to the left
  let leftT=ends?(baseLeftIsA?b:a):(baseLeftIsA?a:b);
  let rightT=(leftT===a)?b:a;
  if(m.invert){const sw=leftT;leftT=rightT;rightT=sw;}    // referee standing on the other side
  const scoreOfT=t=>(t.id===m.a)?s.a:s.b;
  const epend=endsPending(m);
  const golden=(s.a===GOLDEN_AT&&s.b===GOLDEN_AT)&&!over;
  let h='';
  if(over){const wt=teamById(win);
    h+='<div class="winbanner"><div style="font-size:28px">🏆</div><div class="label" style="color:var(--accentInk)">Match won</div>'+
      '<div class="wn anton" style="color:'+tcol(wt)+'">'+esc(wt.name)+'</div>'+
      '<div class="muted" style="font-size:13px;margin-top:4px;font-weight:700">'+s.a+' – '+s.b+'</div></div>';}

  h+='<div class="scorestrip">'+

function addPoint(m,side){
  if(isOver(m))return;
  if(subPending(m)||endsPending(m))return;   // confirm the substitution / change of ends first
  m.log.push(side); pruneAcks(m); save(); render();
}

app.addEventListener('click',e=>{
  const M=id=>state.matches.find(x=>x.id===id);
  const btn=e.target.closest('[data-act]');
  if(btn){
    const act=btn.dataset.act;
    if(act==='closematch'){state.openMatch=null;render();return;}
    if(act==='plus'){const m=M(btn.dataset.match);addPoint(m,btn.dataset.team===m.a?'a':'b');return;}
    if(act==='minus'){const m=M(btn.dataset.match),want=(btn.dataset.team===m.a?'a':'b');
      for(let i=m.log.length-1;i>=0;i--){if(m.log[i]===want){m.log.splice(i,1);break;}}
      pruneAcks(m);save();render();return;}
    if(act==='undo'){const m=M(btn.dataset.match);m.log.pop();pruneAcks(m);save();render();return;}
    if(act==='ackends'){const m=M(btn.dataset.match);m.endsAcked=true;save();render();return;}
    if(act==='startside'){const m=M(btn.dataset.match);
      m.startLeft=((m.startLeft||m.a)===m.a)?m.b:m.a;save();render();return;}
    if(act==='invert'){const m=M(btn.dataset.match);m.invert=!m.invert;save();render();return;}
    if(act==='acksub'){const m=M(btn.dataset.match);
      m.acked=(m.acked||[]).concat([Number(btn.dataset.gate)]);save();render();return;}
    if(act==='serve'){const m=M(btn.dataset.match);
      m.server=(btn.dataset.team===m.a)?'a':'b';save();render();return;}
    if(act==='flip'){const m=M(btn.dataset.match);m.flip=m.flip||{};
      m.flip[btn.dataset.team]=!m.flip[btn.dataset.team];save();render();return;}
    if(act==='autolu'){const m=M(btn.dataset.match),t=teamById(btn.dataset.team);
      m.lineup=m.lineup||{};m.lineup[t.id]=t.players.map(p=>p.id);save();render();return;}
    if(act==='clearlu'){const m=M(btn.dataset.match);m.lineup=m.lineup||{};
      m.lineup[btn.dataset.team]=[null,null,null,null,null,null];save();render();return;}
    if(act==='resetmatch'){const m=M(btn.dataset.match);
      if(confirm('Clear the score for this match? Line-ups are kept.')){m.log=[];save();render();}return;}
    if(act==='resetall'){if(confirm('Reset every score and line-up? Player names are kept.')){
      state.matches=buildFixtures();state.openMatch=null;save();render();}return;}
    if(act==='editroster'){state.editRoster=!state.editRoster;render();return;}
    if(act==='resetroster'){if(confirm('Restore the original team and player names?')){
      const f=freshTeams();TEAMS.forEach((t,i)=>{t.name=f[i].name;t.players.forEach((p,j)=>{p.name=f[i].players[j].name;});});
      save();render();}return;}
    if(act==='sharetable'){shareText(tableText());return;}
    if(act==='sharematch'){shareText(matchText(M(btn.dataset.match)));return;}
  }
  const box=e.target.closest('[data-pt]');
  if(box&&!state.readonly){const m=M(box.dataset.match);
    if(m&&!isOver(m)){addPoint(m,box.dataset.pt===m.a?'a':'b');return;}}
  const row=e.target.closest('.mrow[data-match]');
  if(row){state.openMatch=row.dataset.match;render();}
});

app.addEventListener('change',e=>{
  const s=e.target.closest('select.lu');if(!s)return;
  const m=state.matches.find(x=>x.id===state.openMatch);if(!m)return;
  m.lineup=m.lineup||{};
  if(!m.lineup[s.dataset.lu])m.lineup[s.dataset.lu]=[null,null,null,null,null,null];
  m.lineup[s.dataset.lu][Number(s.dataset.slot)]=s.value||null;
  save();render();
});
app.addEventListener('input',e=>{
  const pn=e.target.closest('input[data-pid]');
  if(pn){const p=playerById(pn.dataset.pid);if(p){p.name=pn.value;save();}return;}
  const tn=e.target.closest('input[data-tname]');
  if(tn){const t=teamById(tn.dataset.tname);if(t){t.name=tn.value;save();}}
});

render();
</script>
</body>
</html>
