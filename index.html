<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="color-scheme" content="dark light">
<title>Pickleboss Friyayy · 35 Split · 21 Aug 26</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --r:13px;
  --accent:#84cc16; --accentD:#65a30d;
  --gold:#ca8a04; --loss:#e11d48; --cyan:#0d9488; --violet:#7c3aed;
  --win:#4d7c0f;
}
/* dark (default) */
html[data-theme="dark"]{
  --bg:#070b16; --surface:#0d1425; --card:#141d33; --cardAlt:#1b2540;
  --border:#25314e; --borderL:#36476e;
  --text:#e9eef9; --muted:#8b98ba; --dim:#5b6a8e;
  --accent:#bef264; --accentD:#84cc16;
  --gold:#fbbf24; --win:#bef264; --loss:#fb7185; --cyan:#2dd4bf; --violet:#a78bfa;
  --onAccent:#0b1220;
  --glow1:rgba(45,212,191,.06); --glow2:rgba(190,242,100,.05);
  --court:#2c5d80; --courtDeep:#24506f; --courtLine:#f4f8fb; --kitchen:#a8542c;
}
html[data-theme="light"]{
  --bg:#f6f7fb; --surface:#eef1f7; --card:#ffffff; --cardAlt:#f1f4fa;
  --border:#dbe1ec; --borderL:#c3ccdc;
  --text:#111827; --muted:#5b6579; --dim:#8b95a8;
  --accent:#4d7c0f; --accentD:#3f6212;
  --gold:#b45309; --win:#3f6212; --loss:#be123c; --cyan:#0f766e; --violet:#6d28d9;
  --onAccent:#ffffff;
  --glow1:rgba(15,118,110,.05); --glow2:rgba(77,124,15,.05);
  --court:#2f6b93; --courtDeep:#27597c; --courtLine:#ffffff; --kitchen:#b45f31;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body.reflock{overflow:hidden}
body{
  background:radial-gradient(1100px 550px at 85% -10%,var(--glow1),transparent 60%),
             radial-gradient(900px 500px at -10% 5%,var(--glow2),transparent 55%),var(--bg);
  color:var(--text);font-family:'Outfit',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  min-height:100vh;-webkit-font-smoothing:antialiased;padding-bottom:74px;
  transition:background .2s,color .2s;
}
.display{font-family:'Bricolage Grotesque','Outfit',sans-serif;letter-spacing:-.02em}
.wrap{max-width:1120px;margin:0 auto;padding:16px 12px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
h1{font-size:23px;margin:0;font-weight:800;line-height:1.1}
h1 span{color:var(--accent)}
.sub{color:var(--muted);font-size:12.5px;margin-top:3px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{background:var(--card);border:1px solid var(--border);padding:5px 10px;border-radius:99px;font-size:11.5px;color:var(--muted)}
.pill b{color:var(--text);font-weight:700}

nav{position:fixed;bottom:0;left:0;right:0;z-index:40;background:var(--surface);
  border-top:1px solid var(--border);display:flex;overflow-x:auto}
nav button{flex:1;min-width:72px;background:none;border:0;color:var(--dim);padding:11px 5px 12px;
  font:600 11.5px 'Outfit';cursor:pointer;border-top:2px solid transparent}
nav button.on{color:var(--accent);border-top-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent)}

.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r)}
.grid{display:grid;gap:12px}
@media(min-width:760px){.g2{grid-template-columns:1fr 1fr}}

.court-card{padding:14px;display:flex;flex-direction:column;gap:10px}
.courtTop{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.gLabel{font:800 15px 'Bricolage Grotesque'}
.courtName{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.1em}
.prog{height:4px;background:var(--surface);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.nextM{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:10px}
.nextLbl{font-size:10px;letter-spacing:.13em;color:var(--dim);text-transform:uppercase;margin-bottom:6px}
.vsRow{display:flex;align-items:center;gap:8px;font-size:13px}
.vsRow .t{flex:1;min-width:0;overflow-wrap:break-word;word-break:normal}
.vs{font-size:10px;color:var(--dim);font-weight:700;flex:none}
.done{color:var(--dim);font-size:13px;font-style:italic}

/* match rows — names wrap to two lines instead of truncating */
.mrow{display:flex;align-items:center;gap:8px;padding:9px 10px;border-bottom:1px solid var(--border)}
.mrow:last-child{border-bottom:0}
.mno{width:30px;font:700 11px 'Outfit';color:var(--dim);flex:none}
.side{flex:1;min-width:0;display:flex;align-items:center}
.side .nm{font-size:13.5px;line-height:1.25;overflow-wrap:break-word;word-break:normal;cursor:default}
.side .nm:hover{color:var(--accent);text-decoration:underline dotted}
.side.w .nm{color:var(--win);font-weight:700}
.side.l .nm{color:var(--muted)}
.side.b{justify-content:flex-end;text-align:right}
input.sc{width:44px;height:34px;text-align:center;background:var(--surface);border:1px solid var(--border);
  color:var(--text);border-radius:7px;font:700 15px 'Outfit';flex:none}
input.sc:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 25%,transparent)}
input.sc.filled{border-color:var(--borderL)}
input.sc:disabled{opacity:.4}
.sep{color:var(--dim);font-size:12px;flex:none}
.refbtn{flex:none;border:1px solid var(--borderL);background:var(--cardAlt);color:var(--muted);
  border-radius:7px;padding:6px 8px;font:700 10px 'Outfit';cursor:pointer;letter-spacing:.05em}
.refbtn:hover{border-color:var(--accent);color:var(--accent)}

/* tables — name column wraps, numbers stay tight */
.tblWrap{padding:0 10px 10px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font:600 9.5px 'Outfit';letter-spacing:.08em;text-transform:uppercase;color:var(--dim);
  text-align:right;padding:8px 4px;border-bottom:1px solid var(--border);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
td{padding:8px 4px;text-align:right;border-bottom:1px solid var(--border);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.name{white-space:normal;overflow-wrap:break-word;word-break:normal;line-height:1.3;min-width:104px;
  display:flex;align-items:flex-start;gap:7px;padding-right:8px}
td.name .txt{flex:1;min-width:0;cursor:pointer}
td.name .txt:hover{color:var(--accent)}
th.num,td.num{width:30px;padding:8px 3px}
.rk{display:inline-flex;width:19px;height:19px;align-items:center;justify-content:center;border-radius:5px;
  font:700 11px 'Outfit';background:var(--surface);color:var(--dim);flex:none;margin-top:1px}
.q1 .rk{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
.q3 .rk{background:color-mix(in srgb,var(--violet) 18%,transparent);color:var(--violet)}
.lgTag{font-size:8.5px;letter-spacing:.08em;padding:1px 4px;border-radius:4px;display:inline-block;margin-top:2px}
.tMain{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
.tGold{background:color-mix(in srgb,var(--gold) 18%,transparent);color:var(--gold)}
.pos{color:var(--gold)} .neg{color:var(--loss)}
.medal{font:800 13px 'Bricolage Grotesque';flex:none}
.mGold{color:var(--gold)} .mSil{color:var(--muted)} .mBronze{color:#d97706}

.hd{font:700 11px 'Outfit';letter-spacing:.09em;text-transform:uppercase;color:var(--dim);
  padding:11px 11px 9px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.hd b{color:var(--text);font-size:14px;letter-spacing:0;text-transform:none}

.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.chip{background:var(--card);border:1px solid var(--border);color:var(--muted);padding:8px 14px;
  border-radius:99px;font:600 13px 'Outfit';cursor:pointer;white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--onAccent)}

.rnd{margin-bottom:20px}
.rndT{font:800 12px 'Bricolage Grotesque';letter-spacing:.13em;text-transform:uppercase;color:var(--muted);
  margin:0 0 10px;display:flex;align-items:center;gap:10px}
.rndT:after{content:'';flex:1;height:1px;background:var(--border)}
.tie{padding:11px 12px}
.tieH{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--dim);margin-bottom:8px}
.tieH .code{color:var(--accent);font-weight:700}
.slot{display:flex;align-items:center;gap:9px;padding:5px 0}
.slot .seed{font:700 9.5px 'Outfit';color:var(--dim);width:48px;flex:none}
.slot .nm{flex:1;min-width:0;font-size:13.5px;line-height:1.25;overflow-wrap:break-word;word-break:normal}
.slot.w .nm{color:var(--win);font-weight:700}
.slot.tbd .nm{color:var(--dim);font-style:italic}
.podium{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px}
.podium>div{flex:1;min-width:170px}

.btn{background:var(--cardAlt);border:1px solid var(--borderL);color:var(--text);padding:9px 14px;
  border-radius:9px;font:600 13px 'Outfit';cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.acc{background:var(--accent);border-color:var(--accent);color:var(--onAccent)}
.btn.dgr{color:var(--loss);border-color:color-mix(in srgb,var(--loss) 40%,transparent)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:7px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.note{color:var(--dim);font-size:12.5px;line-height:1.6}
.hidden{display:none}

.ed{padding:12px}
.edRow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.edRow .ix{width:20px;color:var(--dim);font:700 11px 'Outfit';flex:none}
input.txt,select.txt{flex:1;min-width:0;height:38px;background:var(--surface);border:1px solid var(--border);
  color:var(--text);border-radius:8px;padding:0 10px;font:500 13.5px 'Outfit'}
input.txt:focus,select.txt:focus{outline:0;border-color:var(--accent)}
.warn{background:color-mix(in srgb,var(--gold) 10%,transparent);border:1px solid color-mix(in srgb,var(--gold) 35%,transparent);
  color:var(--gold);border-radius:9px;padding:9px 11px;font-size:12.5px;line-height:1.5;margin-bottom:10px}

/* header tools */
.hdr-tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.sync{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--card);
  color:var(--muted);padding:6px 10px;border-radius:99px;font:700 10.5px 'Outfit';letter-spacing:.05em;cursor:pointer}
.sync .dot{width:7px;height:7px;border-radius:99px;background:currentColor;display:inline-block}
.sync.live{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.sync.live .dot{animation:pulse 1.6s infinite}
.sync.sync{color:var(--cyan)} .sync.off{color:var(--dim)}
.sync.off_line,.sync.error{color:var(--loss);border-color:color-mix(in srgb,var(--loss) 40%,transparent)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.modebtn{border:1px solid var(--borderL);background:var(--cardAlt);color:var(--muted);padding:6px 11px;
  border-radius:99px;font:700 10.5px 'Outfit';letter-spacing:.05em;cursor:pointer}
.modebtn.on{background:var(--accent);border-color:var(--accent);color:var(--onAccent)}
.iconbtn{border:1px solid var(--border);background:var(--card);color:var(--muted);width:32px;height:30px;
  border-radius:99px;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}

.alert{display:flex;gap:9px;align-items:flex-start;border-radius:10px;padding:10px 12px;font-size:12.5px;
  line-height:1.5;margin:6px 0}
.alert.ok{background:color-mix(in srgb,var(--accent) 10%,transparent);border:1px solid color-mix(in srgb,var(--accent) 32%,transparent);color:var(--accent)}
.alert.warn{background:color-mix(in srgb,var(--gold) 10%,transparent);border:1px solid color-mix(in srgb,var(--gold) 32%,transparent);color:var(--gold)}
.alert.bad{background:color-mix(in srgb,var(--loss) 10%,transparent);border:1px solid color-mix(in srgb,var(--loss) 32%,transparent);color:var(--loss)}
.alert b{color:var(--text)}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(4,7,15,.66);backdrop-filter:blur(4px);z-index:90;
  display:flex;align-items:flex-end;justify-content:center}
.sheetM{background:var(--surface);border:1px solid var(--border);border-radius:16px 16px 0 0;width:100%;
  max-width:560px;max-height:90vh;overflow:auto;padding:20px 18px 26px}
@media(min-width:620px){.scrim{align-items:center;padding:20px}.sheetM{border-radius:16px}}
.sheetM h3{font:800 18px 'Bricolage Grotesque';margin:0 0 4px}
.fl{display:block;font:600 10.5px 'Outfit';letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin:12px 0 5px}
.sheetM input[type=text],.sheetM input[type=password],.sheetM select{width:100%;height:38px;background:var(--card);
  border:1px solid var(--border);color:var(--text);border-radius:9px;padding:0 11px;font:500 14px 'Outfit'}
.sheetM input:focus,.sheetM select:focus{outline:0;border-color:var(--accent)}
.hint{color:var(--dim);font-size:12px;line-height:1.55;margin:6px 0 0}
.eyebrow{font:700 10px 'Outfit';letter-spacing:.13em;text-transform:uppercase;color:var(--dim)}


/* ---------- referee console: OSL-style court ---------- */
.refWrap{position:fixed;inset:0;z-index:95;background:var(--bg);overflow:auto;padding:12px 10px 40px}
.refInner{max-width:1000px;margin:0 auto}
.refTop{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.refTop .ttl{flex:1;min-width:0;font:800 15px 'Bricolage Grotesque'}
.refTop .sub2{font:700 10px 'Outfit';color:var(--dim);text-transform:uppercase;letter-spacing:.1em;margin-top:2px}

.scorestrip{display:grid;grid-template-columns:1fr auto 1fr;gap:9px;align-items:stretch;margin-bottom:10px}
.sTeam{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 12px 11px;
  position:relative;overflow:hidden}
.sTeam .stripe{position:absolute;top:0;left:0;right:0;height:3px}
.sTeam .nm2{font-size:12.5px;font-weight:700;line-height:1.25;overflow-wrap:break-word;word-break:normal}
.sTeam .num{font:800 44px 'Bricolage Grotesque';line-height:.95;margin-top:2px}
.sTeam.right{text-align:right}
.phasebox{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:52px;padding:0 3px}
.phasebox .cv{font:800 17px 'Bricolage Grotesque';color:var(--gold);line-height:1;
  display:flex;align-items:center;gap:3px}
.phasebox .cl{font:800 8px 'Outfit';letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-top:3px}

.tossbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;background:var(--card);
  border:1px solid var(--border);border-radius:11px;padding:9px 11px;margin-bottom:8px}
.tossbar .eyebrow{flex:none}
.tossbar .dimtxt{color:var(--dim);font-size:11px;font-weight:600}

.court{position:relative;display:grid;grid-template-columns:1fr 7px 1fr;border-radius:10px;
  overflow:hidden;border:3px solid var(--courtLine);margin-bottom:9px;user-select:none;
  box-shadow:0 2px 14px rgba(0,0,0,.22)}
.half{display:grid;grid-template-rows:1fr 1fr;background:var(--court);position:relative}
.half.b{background:var(--courtDeep)}
.net{background:repeating-linear-gradient(180deg,#f8fafc 0 4px,#94a3b8 4px 8px);
  border-left:1px solid rgba(0,0,0,.25);border-right:1px solid rgba(0,0,0,.25)}
/* the non-volley zone — the kitchen — sits against the net in its own colour */
.kitchen{position:absolute;top:0;bottom:0;width:20%;z-index:1;pointer-events:none;
  background:var(--kitchen)}
.half.a .kitchen{right:0;border-left:2px solid var(--courtLine)}
.half.b .kitchen{left:0;border-right:2px solid var(--courtLine)}
.kitchen:after{content:'KITCHEN';position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%) rotate(-90deg);white-space:nowrap;
  font:800 8px 'Outfit';letter-spacing:.2em;color:rgba(255,255,255,.55)}
/* the text sits clear of the kitchen so nothing overlaps it */
.cbox{position:relative;z-index:2;padding:12px 12px 21px;min-height:96px;display:flex;
  flex-direction:column;justify-content:center;gap:4px;cursor:pointer}
.half.a .cbox{padding-right:calc(20% + 10px)}
.half.b .cbox{padding-left:calc(20% + 10px)}
.half .cbox:first-child{border-bottom:2px solid var(--courtLine)}
.cbox:hover{background:rgba(255,255,255,.08)}
.cbox:active{background:rgba(255,255,255,.16)}
.cbox.locked{cursor:default}.cbox.locked:hover{background:transparent}
.cbox.serving{background:rgba(253,224,71,.13)}
.posTag{font:800 8.5px 'Outfit';letter-spacing:.11em;color:rgba(255,255,255,.72);text-transform:uppercase}
.pSlot{display:flex;align-items:center;gap:6px;min-width:0;flex-wrap:wrap}
.pSlot .sl{font:800 12px 'Outfit';color:#fde047;flex:none}
.pSlot .pn{font-size:14.5px;font-weight:700;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.55);
  overflow-wrap:break-word;word-break:normal}
.ball{flex:none;display:inline-block;vertical-align:-2px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))}
.servetag{font:800 8.5px 'Outfit';letter-spacing:.06em;text-transform:uppercase;color:#fde047;
  margin-top:2px;line-height:1.3}
.taphint{position:absolute;bottom:4px;left:0;right:0;text-align:center;font:800 8.5px 'Outfit';
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px;color:rgba(255,255,255,.6);
  letter-spacing:.07em;text-transform:uppercase;z-index:3;pointer-events:none}
.endsnote{display:flex;justify-content:space-between;align-items:center;gap:9px;flex-wrap:wrap;
  font-size:11px;color:var(--muted);font-weight:600;margin-bottom:10px}
.ctrls{display:grid;gap:8px;margin-bottom:10px}
@media(min-width:620px){.ctrls{grid-template-columns:1fr 1fr}}
.ctrlrow{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--border);
  border-radius:11px;padding:8px 10px}
.ctrlrow .tl{flex:1;min-width:0;font-size:12.5px;font-weight:700;overflow-wrap:break-word;word-break:normal}
.rbtn{width:44px;height:38px;border-radius:9px;border:1px solid var(--borderL);background:var(--cardAlt);
  color:var(--text);font:800 20px 'Outfit';cursor:pointer;flex:none;line-height:1}
.rbtn:disabled{opacity:.35;cursor:default}
.rbtn.plus{border:0;color:#fff}
.gamept{border-radius:9px;padding:8px 11px;font:700 12px 'Outfit';text-align:center;margin-bottom:9px;
  background:color-mix(in srgb,var(--gold) 12%,transparent);
  border:1px solid color-mix(in srgb,var(--gold) 40%,transparent);color:var(--gold)}
.gamept.win{background:color-mix(in srgb,var(--accent) 12%,transparent);
  border-color:color-mix(in srgb,var(--accent) 45%,transparent);color:var(--accent)}
.gamept.golden{background:color-mix(in srgb,var(--loss) 12%,transparent);
  border-color:color-mix(in srgb,var(--loss) 48%,transparent);color:var(--loss);
  animation:goldpulse 1.5s ease-in-out infinite}
@keyframes goldpulse{0%,100%{opacity:1}50%{opacity:.62}}

.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--accent);
  color:var(--onAccent);padding:10px 18px;border-radius:99px;font:600 13px 'Outfit';z-index:120;
  opacity:0;transition:opacity .25s;pointer-events:none;max-width:88vw;text-align:center}
.toast.on{opacity:1}
.liveDot{color:var(--accent);font-size:9px;vertical-align:2px}
td.name .txt{cursor:default}
td.name .txt.link{cursor:pointer}
td.name .txt.link:hover{color:var(--accent)}
.side .nm{cursor:default}
.side .nm:hover{color:inherit;text-decoration:none}
/* ---- print sheet: mirrors the Excel scoresheet ---- */
#printArea{display:none}
@media print{
  @page{margin:10mm}
  body{background:#fff!important;color:#000!important;padding:0}
  .wrap,nav,.toast,#modalRoot,.scrim,.refWrap{display:none!important}
  #printArea{display:block;font-family:'Outfit',Arial,sans-serif;color:#000}

  #printArea .psheet{page-break-after:always}
  #printArea .psheet:last-child{page-break-after:auto}

  #printArea .ph{display:flex;justify-content:space-between;align-items:baseline;
    border-bottom:1px solid #999;padding-bottom:3px;margin-bottom:8px}
  #printArea .ph .t{font-size:15px;font-weight:800;letter-spacing:-.01em}
  #printArea .ph .r{font-size:10px;color:#555}

  #printArea .cols{display:flex;gap:10px;align-items:flex-start}
  #printArea .cols>div{flex:1;min-width:0}

  /* match card */
  table.mc{width:100%;border-collapse:collapse;margin-bottom:6px;font-size:10px;
    page-break-inside:avoid}
  table.mc th{border:1px solid #000;padding:2px 5px;font-size:8px;font-weight:700;
    letter-spacing:.06em;text-transform:uppercase;background:#eee;text-align:left;color:#000}
  table.mc th.c{text-align:center}
  table.mc td{border:1px solid #666;padding:4px 5px;font-size:10.5px;height:19px}
  table.mc td.c{text-align:center;width:36px}
  table.mc td.wl{text-align:center;width:30px;font-weight:700}
  table.mc td.bye{color:#999;font-style:italic}
  table.mc tr.win td{font-weight:700}

  /* score-margin grid */
  #printArea .gridT{margin-top:8px}
  #printArea .gridT .cap{font-size:8px;letter-spacing:.1em;text-transform:uppercase;
    color:#555;margin-bottom:3px}
  table.grid{width:100%;border-collapse:collapse;font-size:9px;page-break-inside:avoid}
  table.grid th,table.grid td{border:1px solid #666;padding:3px 4px;height:17px}
  table.grid th{background:#eee;font-size:7.5px;font-weight:700;text-transform:uppercase;
    letter-spacing:.04em;color:#000}
  table.grid th.v{font-size:7px;font-weight:600;text-transform:none;letter-spacing:0;line-height:1.15}
  table.grid td.c{text-align:center}
  table.grid td.dg{background:#ddd}
  table.grid td.nm{font-size:9.5px;white-space:nowrap}
  table.grid td.tot{text-align:center;font-weight:700}

  /* knockout box */
  #printArea .rows{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
  #printArea .rows>table{flex:1 1 calc(50% - 5px);min-width:calc(50% - 5px)}
  #printArea .rlbl{font-size:9px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
    text-align:center;border-top:1px solid #000;border-bottom:1px solid #000;padding:3px 0;margin:10px 0 7px}
  table.ko{border-collapse:collapse;font-size:10px;page-break-inside:avoid}
  table.ko th{border:1px solid #000;background:#eee;padding:2px 5px;font-size:8px;
    text-transform:uppercase;letter-spacing:.06em;text-align:left;color:#000}
  table.ko th.c{text-align:center;width:36px}
  table.ko td{border:1px solid #666;padding:4px 5px;height:19px}
  table.ko td.seed{width:34px;font-size:8px;color:#555;text-align:center}
  table.ko td.c{text-align:center;width:36px}
  table.ko td.wl{text-align:center;width:30px;font-weight:700}
  table.ko td.tbd{color:#aaa;font-style:italic}
  table.ko tr.win td{font-weight:700}

  #printArea .place{width:auto;margin-top:10px;border-collapse:collapse;font-size:11px}
  #printArea .place th{border:1px solid #000;background:#eee;padding:4px 10px;text-align:left;font-size:9px}
  #printArea .place td{border:1px solid #666;padding:4px 14px;min-width:170px}
  #printArea .foot{margin-top:8px;font-size:8px;color:#777}
  /* branding on every printed page */
  #printArea .brandbar{display:flex;align-items:center;gap:10px;border-bottom:2px solid #000;
    padding-bottom:5px;margin-bottom:9px}
  #printArea .brandbar img{height:30px;width:auto}
  #printArea .brandbar .bt{flex:1;min-width:0}
  #printArea .brandbar .t{font-size:14.5px;font-weight:800;letter-spacing:-.01em;line-height:1.15}
  #printArea .brandbar .r{font-size:9.5px;color:#555;margin-top:2px}
  #printArea .brandbar .ct{text-align:right;font-size:9.5px;color:#333;line-height:1.45;white-space:nowrap}
  #printArea .brandbar .ct b{font-size:12px;display:block;letter-spacing:.01em}
  #printArea .pagefoot{margin-top:9px;padding-top:5px;border-top:1px solid #bbb;
    display:flex;justify-content:space-between;gap:10px;font-size:8.5px;color:#666}

  #printArea .pb{page-break-before:always}
}

.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo{height:38px;width:auto;flex:none;display:block}
html[data-theme="dark"] .logo{filter:invert(1) brightness(1.9)}
.logo.sm{height:26px;opacity:.9}
.sitefoot{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:26px;padding:14px 4px 0;
  border-top:1px solid var(--border)}
.fLine{font-size:12px;color:var(--dim);line-height:1.6}
.fLine b{color:var(--muted)}
a.tel{color:var(--accent);font-weight:700;text-decoration:none;font-size:13.5px;
  border-bottom:1px dashed color-mix(in srgb,var(--accent) 55%,transparent);padding-bottom:1px}

.expbar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}

.rsT{font-size:13.5px;font-weight:700}
.rsN{font-size:11.5px;color:var(--dim);margin-top:1px}
.shareBox{width:100%;height:190px;background:var(--card);border:1px solid var(--border);

  resize:vertical;white-space:pre;overflow:auto}
.shareBox:focus{outline:0;border-color:var(--accent)}

/* ---- live sync chrome ---- */
.sync{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--card);
  color:var(--muted);padding:6px 11px;border-radius:99px;font:700 11px 'Outfit';letter-spacing:.06em;cursor:pointer}
.sync .dot{width:7px;height:7px;border-radius:99px;background:currentColor;display:inline-block}
.sync.live{color:var(--accent);border-color:rgba(190,242,100,.4)}
.sync.live .dot{animation:pulse 1.6s infinite}
.sync.sync{color:var(--cyan)} .sync.off{color:var(--dim)}
.sync.off_line,.sync.error{color:var(--loss);border-color:rgba(251,113,133,.4)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.modebtn{border:1px solid var(--borderL);background:var(--cardAlt);color:var(--muted);padding:6px 12px;
  border-radius:99px;font:700 11px 'Outfit';letter-spacing:.06em;cursor:pointer}
.modebtn.on{background:var(--accent);border-color:var(--accent);color:#0b1220}
.hdr-tools{display:flex;gap:7px;align-items:center;flex-wrap:wrap}

.alert{display:flex;gap:9px;align-items:flex-start;border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.5;margin:6px 0}
.alert.ok{background:rgba(190,242,100,.08);border:1px solid rgba(190,242,100,.3);color:#d9f99d}
.alert.warn{background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.3);color:#fcd34d}
.alert.bad{background:rgba(251,113,133,.08);border:1px solid rgba(251,113,133,.3);color:#fda4af}
.alert b{color:var(--text)}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(4,7,15,.72);backdrop-filter:blur(4px);z-index:90;display:flex;align-items:flex-end;justify-content:center;padding:0}
.sheet{background:var(--surface);border:1px solid var(--border);border-radius:16px 16px 0 0;width:100%;max-width:560px;max-height:88vh;overflow:auto;padding:20px 18px 26px}

.sheet input[type=text]:focus{outline:0;border-color:var(--accent)}
.hint{color:var(--dim);font-size:12px;line-height:1.55;margin:6px 0 0}
.eyebrow{font:700 10px 'Outfit';letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}

/* league table */

function buildMatches(teams, old){

    const half=t.length/2; let idx=t.map((_,i)=>i), no=1;

      for(let i=0;i<half;i++){ const a=t[idx[i]],b=t[idx[t.length-1-i]];

      idx=[idx[0],...idx.slice(-1),...idx.slice(1,-1)];
    }
  }
  out.forEach(m=>{ const p=prev[pairKey(m.a,m.b)];

  return out;

    g[k]={court:SEED[k].court, teams, matches:buildMatches(teams)}; });
  return { groups:g, ko:{}, diamond:{}, platinum:{},
           tab:'courts', grp:'A', fin:'diamond', edit:false,
           scorer:false, mode:'entry', theme:'dark', pin:'', ref:null };
}
function load(){
  try{const r=localStorage.getItem(STORE_KEY); if(r){const p=JSON.parse(r);
    if(p&&p.groups){ p.ko=p.ko||{}; p.diamond=p.diamond||{}; p.platinum=p.platinum||{};
      p.fin=p.fin||'diamond'; p.mode=p.mode||'entry'; p.theme=p.theme||'dark';
      p.pin=p.pin||''; p.ref=null; return p; }}}catch(e){}
  return blank();
}
function save(){ try{localStorage.setItem(STORE_KEY, JSON.stringify(
    Object.assign({},S,{ref:null}))); }catch(e){}
  if(typeof syncScan==='function') syncScan(); }
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('on');
  clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),1800);}
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const attr=s=>esc(s).replace(/'/g,'&#39;');

/* ===================== standings ===================== */
const played=m=>m.sa!=null&&m.sb!=null&&!(m.sa===0&&m.sb===0);
function standings(gk){
  const G=S.groups[gk], rows={};
  G.teams.forEach(t=>rows[t]={team:t,p:0,w:0,l:0,pf:0,pa:0});
  G.matches.forEach(m=>{ if(!played(m))return; const A=rows[m.a],B=rows[m.b]; if(!A||!B)return;
    A.p++;B.p++;A.pf+=m.sa;A.pa+=m.sb;B.pf+=m.sb;B.pa+=m.sa;
    if(m.sa>m.sb){A.w++;B.l++;}else if(m.sb>m.sa){B.w++;A.l++;} });
  const list=Object.values(rows); list.forEach(r=>r.d=r.pf-r.pa);
  const h2h=(x,y)=>{let s=0;G.matches.forEach(m=>{if(!played(m))return;
    if(m.a===x&&m.b===y)s+=m.sa>m.sb?1:-1; if(m.a===y&&m.b===x)s+=m.sb>m.sa?1:-1;});return s;};
  list.sort((x,y)=>(y.w-x.w)||(y.d-x.d)||h2h(y.team,x.team)||(y.pf-x.pf)||x.team.localeCompare(y.team));
  list.forEach((r,i)=>r.rank=i+1);
  return list;
}
const groupDone=g=>S.groups[g].matches.length>0&&S.groups[g].matches.every(played);
function seedName(code){ const g=code[0], r=+code.slice(1);
  if(!groupDone(g)) return ''; const st=standings(g); return st[r-1]?st[r-1].team:''; }

/* ===================== knockout resolution ===================== */
function tieWinner(c){ const t=S.ko[c]; if(!t||t.sa==null||t.sb==null)return '';
  return t.sa>t.sb?t.a:t.sb>t.sa?t.b:''; }
function tieLoser(c){ const t=S.ko[c]; if(!t||t.sa==null||t.sb==null)return '';
  return t.sa>t.sb?t.b:t.sb>t.sa?t.a:''; }
function refName(ref){
  if(/^[A-F][1-8]$/.test(ref)) return seedName(ref);
  if(ref.startsWith('W:')) return tieWinner(ref.slice(2));
  if(ref.startsWith('L:')) return tieLoser(ref.slice(2));
  return '';
}
function refLabel(ref){
  if(ref.startsWith('W:')) return 'Win '+ref.slice(2);
  if(ref.startsWith('L:')) return 'SF '+ref.slice(2)+' L';
  return ref;
}
function setTie(code,a,b){
  const t=S.ko[code]||(S.ko[code]={a:'',b:'',sa:null,sb:null,log:null});
  if(t.a!==a){t.a=a; if(!a){t.sa=null;t.sb=null;t.log=null;}}
  if(t.b!==b){t.b=b; if(!b){t.sa=null;t.sb=null;t.log=null;}}
}
const leaguePairs=()=>[[0,1],[0,2],[1,2]];
function setLeague(store,srcRefs){
  const names=srcRefs.map(refName);
  leaguePairs().forEach((pr,i)=>{
    const a=names[pr[0]],b=names[pr[1]];
    const m=store[i]||(store[i]={a:'',b:'',sa:null,sb:null,log:null});
    if(m.a!==a){m.a=a; if(!a){m.sa=null;m.sb=null;m.log=null;}}
    if(m.b!==b){m.b=b; if(!b){m.sa=null;m.sb=null;m.log=null;}}
  });
}
function refresh(){
  for(let i=0;i<3;i++){
    QF.forEach(([c,x,y])=>setTie(c,seedName(x),seedName(y)));
    SF.forEach(([c,x,y])=>setTie(c,refName(x),refName(y)));
    GOLD.forEach(([c,x,y])=>setTie(c,seedName(x),seedName(y)));
    setLeague(S.diamond,DIAMOND_SRC); setLeague(S.platinum,PLATINUM_SRC);
  }
}
function leagueTable(store,srcRefs){
  const names=srcRefs.map(refName), rows={};
  names.forEach(n=>{ if(n) rows[n]={team:n,p:0,w:0,l:0,pf:0,pa:0}; });
  leaguePairs().forEach((pr,i)=>{ const m=store[i]; if(!m)return;
    if(m.sa==null||m.sb==null||!m.a||!m.b)return;
    const A=rows[m.a],B=rows[m.b]; if(!A||!B)return;
    A.p++;B.p++;A.pf+=m.sa;A.pa+=m.sb;B.pf+=m.sb;B.pa+=m.sa;
    if(m.sa>m.sb){A.w++;B.l++;}else if(m.sb>m.sa){B.w++;A.l++;} });
  const list=Object.values(rows); list.forEach(r=>r.d=r.pf-r.pa);
  list.sort((x,y)=>(y.w-x.w)||(y.d-x.d)||(y.pf-x.pf)||x.team.localeCompare(y.team));
  list.forEach((r,i)=>r.rank=i+1);
  return list;
}

function openPair(g, name){
  if(!S.scorer) return toast('Scorer mode only');
  const others=GROUPS.filter(k=>k!==g);
  openModal(`<h3>${esc(name)}</h3>
    <p class="hint">Currently in Group ${g} · ${esc(S.groups[g].court)}</p>
    <label class="fl">Pair name</label>
    <input type="text" id="pairName" value="${attr(name)}" placeholder="Player one | Player two">
    <p class="hint">Renaming keeps every result this pair has already played.</p>
    <label class="fl">Move to another group</label>
    <select id="pairMove">
      <option value="">Stay in Group ${g}</option>
      ${others.map(k=>`<option value="${k}"${S.groups[k].teams.length>=MAX_TEAMS?' disabled':''}>Group ${k} · ${esc(S.groups[k].court)} (${S.groups[k].teams.length} teams)${S.groups[k].teams.length>=MAX_TEAMS?' — full':''}</option>`).join('')}
    </select>

    are leaving are cleared for this pair; everyone else keeps theirs.</p>
    <div class="row" style="margin-top:16px">

    </div>

}
function applyPair(g, oldName){
  const nu=(document.getElementById('pairName').value||'').trim();
  const dest=document.getElementById('pairMove').value;
  if(!nu){ toast('Name cannot be empty'); return; }
  const G=S.groups[g];
  const i=G.teams.indexOf(oldName);
  if(i<0){ closeModal(); return; }
  // rename within current group first
  if(nu!==oldName){
    const clash=(dest?S.groups[dest].teams:G.teams).some((t,j)=>t===nu&&(dest||j!==i));
    if(clash){ toast('That name is already in that group'); return; }
    G.teams[i]=nu;
    G.matches.forEach(m=>{ if(m.a===oldName)m.a=nu; if(m.b===oldName)m.b=nu; });
  }
  if(dest){
    const D=S.groups[dest];
    if(D.teams.length>=MAX_TEAMS){ toast('That group is full'); return; }
    G.teams.splice(G.teams.indexOf(nu),1);
    G.matches=buildMatches(G.teams, G.matches.filter(m=>m.a!==nu&&m.b!==nu));
    D.teams.push(nu);
    D.matches=buildMatches(D.teams, D.matches);
    toast(nu+' moved to Group '+dest);
  } else if(nu!==oldName){ toast('Renamed to '+nu); }
  save(); closeModal();
}
function removePair(g,name){
  if(!confirm('Remove '+name+' from the tournament? Their results are cleared.')) return;
  const G=S.groups[g], i=G.teams.indexOf(name);
  if(i>=0){ G.teams.splice(i,1);
    G.matches=buildMatches(G.teams, G.matches.filter(m=>m.a!==name&&m.b!==name)); }
  save(); closeModal(); toast(name+' removed');
}

/* ===================== theme ===================== */
function applyTheme(){ document.documentElement.setAttribute('data-theme', S.theme); }
function toggleTheme(){ S.theme = S.theme==='dark'?'light':'dark'; applyTheme(); save(); render(); }
/* ===================== match addressing =====================
     g:<group>:<matchNo> | t:<code> | l:<which>:<index>            */
function getMatch(ref){
  const p=ref.split(':');
  if(p[0]==='g'){ const G=S.groups[p[1]]; return G?G.matches.find(m=>m.n===+p[2]):null; }
  if(p[0]==='t') return S.ko[p[1]]||null;
  if(p[0]==='l') return (p[1]==='diamond'?S.diamond:S.platinum)[+p[2]]||null;
  return null;
}
function matchTitle(ref){
  const p=ref.split(':');
  if(p[0]==='g') return 'Group '+p[1]+' · Match '+p[2];
  if(p[0]==='t'){ const c=p[1];
    if(['G','H','I','J','K','L'].includes(c)) return 'Quarter-final '+c;
    if(['M','N','O'].includes(c)) return 'Semi-final '+c;
    return 'Gold tie '+c; }
  return (p[1]==='diamond'?'Diamond':'Platinum')+' league · Round '+(+p[2]+1);
}
const matchCourt=ref=>ref.split(':')[0]==='g' ? S.groups[ref.split(':')[1]].court : 'Finals court';

/* a pair name is "One | Two" — split it for the court diagram */
function playersOf(name){
  const parts=String(name||'').split('|').map(s=>s.trim()).filter(Boolean);
  if(parts.length>=2) return [parts[0],parts[1]];
  if(parts.length===1) return [parts[0],'—'];
  return ['—','—'];
}

/* ===================== pickleball doubles scoring =====================
   Side-out doubles (§4.B). Only the serving side can score. The server always
   delivers from the right when their own score is even, so the two partners
   swap sides each time they score and the geometry follows the score by itself.
   Losing the rally passes the serve to the partner (first server) or across the
   net (second server). The opening serve of a game has only one server, so the
   first fault is an immediate side-out.

   m.log holds one entry per rally — 'a' or 'b', whoever WON it. Everything else
   here is derived, so Undo is exact and the score can never drift out of step
   with the court positions. */
function replayPB(m){
  const log=m.log||[];
  const first=(m.server==='b')?'b':'a';
  // pos[team] = [index of the player standing right, index standing left]
  const pos={ a:(m.posA===1?[1,0]:[0,1]), b:(m.posB===1?[1,0]:[0,1]) };
  let a=0,b=0, serving=first;
  let who=pos[first][0];        // the chosen starting server stands on the right at 0
  log.forEach(w=>{
    if(w==='a')a++; else b++;                       // rally scoring: every rally is a point
    if(w===serving){
      pos[serving]=[pos[serving][1],pos[serving][0]];   // partners swap, same player serves on
    } else {
      serving=w;                                        // serve crosses with the point
      const sc=(serving==='a')?a:b;
      who=pos[serving][sc%2===0?0:1];                   // whoever stands on the correct side
    }
  });
  return { a,b,serving,pos, serverIdx:who,
           servePos:(pos[serving][0]===who?'R':'L'), rallies:log.length };
}
/* Game to 15 and it must be won by two — but the two-point rule is capped.
   Once both sides reach 17 the next rally decides it, so no score can pass 18
   and 18-17 is the golden point. */
const gameOver=(a,b)=>
  ((a>=TARGET||b>=TARGET) && Math.abs(a-b)>=WIN_BY) || a>=CAP || b>=CAP;
const isGolden=(a,b)=>a>=GOLDEN&&b>=GOLDEN&&!gameOver(a,b);
/* a side is on game point when winning the next rally would end the match */
function gamePointSides(a,b){
  if(gameOver(a,b)) return [];
  const out=[];
  if(gameOver(a+1,b)) out.push('a');
  if(gameOver(a,b+1)) out.push('b');
  return out;
}

/* ---------- console state ---------- */
function openRef(ref){
  const m=getMatch(ref);
  if(!m||!m.a||!m.b) return toast('Both teams must be known first');
  if(!S.scorer) return toast('Scorer mode only');
  if(m.log==null && played(m) && !confirm('This match already has a typed score of '+m.sa+'–'+m.sb+
     '. Opening the referee console starts it again from 0–0. Continue?')) return;
  m.server=m.server||'a'; m.posA=m.posA||0; m.posB=m.posB||0;
  m.startLeft=m.startLeft||'a'; m.invert=!!m.invert;
  if(m.log==null) m.log=[];
  S.ref=ref; document.body.classList.add('reflock'); save(); renderRef();
}
function closeRef(){ S.ref=null; document.body.classList.remove('reflock');
  document.getElementById('refRoot').innerHTML=''; render(); }
function refPoint(side){
  const m=getMatch(S.ref); if(!m) return;
  const st=replayPB(m); if(gameOver(st.a,st.b)) return;
  m.log=(m.log||[]).concat([side]);
  const n=replayPB(m); m.sa=n.a; m.sb=n.b;
  save(); renderRef();
}
function refMinus(side){
  const m=getMatch(S.ref); if(!m||!(m.log||[]).length) return;
  // walk back to the last rally that gave this side a point
  const log=m.log.slice();
  for(let i=log.length;i>0;i--){
    const trial=Object.assign({},m,{log:log.slice(0,i-1)});
    const before=replayPB(trial), after=replayPB(Object.assign({},m,{log:log.slice(0,i)}));
    if(after[side]>before[side]){ m.log=log.slice(0,i-1); break; }
  }
  const n=replayPB(m); m.sa=n.a; m.sb=n.b; save(); renderRef();
}
function refUndo(){
  const m=getMatch(S.ref); if(!m||!(m.log||[]).length) return;
  m.log=m.log.slice(0,-1);
  const n=replayPB(m); m.sa=n.a; m.sb=n.b; save(); renderRef();
}
function refSetServer(s){ const m=getMatch(S.ref); if(!m||(m.log||[]).length)return;
  m.server=s; save(); renderRef(); }
function refSwapSides(){ const m=getMatch(S.ref); if(!m||(m.log||[]).length)return;
  m.startLeft=(m.startLeft==='a')?'b':'a'; save(); renderRef(); }
function refFlipPos(team){ const m=getMatch(S.ref); if(!m||(m.log||[]).length)return;
  if(team==='a') m.posA=m.posA?0:1; else m.posB=m.posB?0:1; save(); renderRef(); }
function refInvert(){ const m=getMatch(S.ref); if(!m)return; m.invert=!m.invert; save(); renderRef(); }
function refClear(){
  const m=getMatch(S.ref); if(!m)return;
  if(!confirm('Clear this match back to 0–0?'))return;
  m.log=[]; m.sa=null; m.sb=null; save(); renderRef();
}
function refFinish(){
  const m=getMatch(S.ref); if(!m)return;
  const st=replayPB(m);
  if(!(m.log||[]).length){ m.sa=null;m.sb=null;m.log=null; save(); toast('Closed — nothing recorded'); return closeRef(); }
  m.sa=st.a; m.sb=st.b; save(); toast('Saved · '+st.a+'–'+st.b); closeRef();
}

/* ---------- console render ---------- */
/* a pickleball — yellow with its perforations */
const BALL='<svg class="ball" width="16" height="16" viewBox="0 0 24 24" aria-label="serving">'+
  '<circle cx="12" cy="12" r="10.5" fill="#fde047" stroke="#a16207" stroke-width="1.4"/>'+
  '<g fill="#a16207" opacity=".85"><circle cx="8.4" cy="7.6" r="1.5"/><circle cx="15.6" cy="7.6" r="1.5"/>'+
  '<circle cx="12" cy="12" r="1.5"/><circle cx="6.6" cy="14" r="1.4"/><circle cx="17.4" cy="14" r="1.4"/>'+
  '<circle cx="12" cy="18.3" r="1.4"/></g></svg>';
function cboxHTML(m,teamKey,posSide,st,over){
  const idx=st.pos[teamKey][posSide==='R'?0:1];
  const nm=playersOf(teamKey==='a'?m.a:m.b)[idx];
  const isServer=st.serving===teamKey&&st.servePos===posSide&&!over;
  return `<div class="cbox ${over?'locked':''} ${isServer?'serving':''}"
      ${over?'':`onclick="refPoint('${teamKey}')"`}>
    <div class="posTag">${posSide==='R'?'Right / even':'Left / odd'}</div>
    <div class="pSlot">${isServer?BALL:''}
      <span class="sl">${teamKey.toUpperCase()}${idx+1}</span>
      <span class="pn">${esc(nm)}</span></div>
    ${isServer?`<div class="servetag">serving from the ${posSide==='R'?'right':'left'}</div>`:''}
  </div>`;
}
function renderRef(){
  if(!S.ref){ document.getElementById('refRoot').innerHTML=''; return; }
  const ref=S.ref, m=getMatch(ref);
  if(!m){ closeRef(); return; }
  const st=replayPB(m), over=gameOver(st.a,st.b), gps=gamePointSides(st.a,st.b);
  const fresh=!(m.log||[]).length;
  const lead=Math.max(st.a,st.b), ends=lead>=SWITCH_AT;

  /* left/right follow where the teams actually stand, so the referee always
     taps the side of the court the team is on */
  let leftK=(m.startLeft==='a')?'a':'b';
  if(ends) leftK=(leftK==='a')?'b':'a';
  if(m.invert) leftK=(leftK==='a')?'b':'a';
  const rightK=(leftK==='a')?'b':'a';
  const nameOf=k=>k==='a'?m.a:m.b;
  const scoreOf=k=>k==='a'?st.a:st.b;
  const colOf=k=>k==='a'?'var(--cyan)':'var(--violet)';

  let h=`<div class="refWrap"><div class="refInner">
    <div class="refTop"><button class="iconbtn" onclick="refFinish()">✕</button>
      <div class="ttl">${esc(matchTitle(ref))}
        <div class="sub2">${esc(matchCourt(ref))} · rally scoring · to ${TARGET} · win by ${WIN_BY} · golden point ${CAP}–${GOLDEN}</div></div></div>`;

  if(over){
    const lo=Math.min(st.a,st.b), w=st.a>st.b?m.a:m.b;
    h+=`<div class="gamept win">🏆 ${esc(w)} win ${lead}–${lo}${
      lead===CAP&&lo===GOLDEN?' on the golden point':''}</div>`;
  } else if(isGolden(st.a,st.b)){
    h+=`<div class="gamept golden">⚡ <b>Golden point</b> — the next rally wins the match at ${CAP}–${GOLDEN}.</div>`;
  } else if(gps.length){
    h+=`<div class="gamept">Game point · ${gps.map(k=>esc(nameOf(k))).join(' &amp; ')}</div>`;
  }

  h+=`<div class="scorestrip">
    <div class="sTeam"><div class="stripe" style="background:${colOf(leftK)}"></div>
      <div class="nm2">${esc(nameOf(leftK))}</div>
      <div class="num" style="color:${colOf(leftK)}">${scoreOf(leftK)}</div></div>
    <div class="phasebox"><div class="cv">${over?'—':(st.serving===leftK?BALL+'<span>◀</span>':'<span>▶</span>'+BALL)}</div>
      <div class="cl">Serve</div></div>
    <div class="sTeam right"><div class="stripe" style="background:${colOf(rightK)}"></div>
      <div class="nm2">${esc(nameOf(rightK))}</div>
      <div class="num" style="color:${colOf(rightK)}">${scoreOf(rightK)}</div></div></div>`;

  /* pre-match set-up — locks the moment the first rally is recorded */
  if(fresh && !over){
    h+=`<div class="tossbar"><span class="eyebrow">Serves first</span>
      ${[leftK,rightK].map(k=>`<button class="btn sm ${m.server===k?'acc':''}"

    h+=`<div class="tossbar"><span class="eyebrow">Court sides</span>
      <span style="font-size:12px;font-weight:700">${esc(nameOf(leftK))} <span class="dimtxt">left</span>
        &nbsp;·&nbsp; ${esc(nameOf(rightK))} <span class="dimtxt">right</span></span>
      <button class="btn sm" onclick="refSwapSides()">⇄ Swap</button>
      <span class="dimtxt">set this to match where the teams actually stand</span></div>`;
    h+=`<div class="tossbar"><span class="eyebrow">Starting positions</span>
      ${[leftK,rightK].map(k=>{
        const idx=st.pos[k][0];
        return `<span style="font-size:11.5px;font-weight:700">${esc(nameOf(k))}
          <span class="dimtxt">${esc(playersOf(nameOf(k))[idx])} right</span>
          <button class="btn sm" onclick="refFlipPos('${k}')">⇄</button></span>`;}).join('')}
      <span class="dimtxt">the pair chooses its starting server</span></div>`;
  }

  h+=`<div class="court">
    <div class="half a">${cboxHTML(m,leftK,'L',st,over)}${cboxHTML(m,leftK,'R',st,over)}
      <div class="kitchen"></div><div class="taphint">${over?'':'tap = +1 '}${esc(nameOf(leftK))}</div></div>
    <div class="net"></div>
    <div class="half b">${cboxHTML(m,rightK,'R',st,over)}${cboxHTML(m,rightK,'L',st,over)}
      <div class="kitchen"></div><div class="taphint">${over?'':'tap = +1 '}${esc(nameOf(rightK))}</div></div>
  </div>`;

  h+=`<div class="endsnote">
    <span>${ends?`⇄ Ends changed at ${SWITCH_AT} — ${esc(nameOf(leftK))} now on the left`:''}</span>
    <button class="btn sm ${m.invert?'acc':''}" onclick="refInvert()">⇄ ${m.invert?'View flipped':'Flip my view'}</button></div>`;

  h+=`<div class="ctrls">${[leftK,rightK].map(k=>`
    <div class="ctrlrow">
      <button class="rbtn" onclick="refMinus('${k}')" ${scoreOf(k)===0?'disabled':''}>−</button>
      <div class="tl">${esc(nameOf(k))}</div>
      <button class="rbtn plus" onclick="refPoint('${k}')" ${over?'disabled':''}
        style="background:${colOf(k)}">+</button></div>`).join('')}</div>`;

  h+=`<div class="row" style="margin-bottom:10px">
    <button class="btn" onclick="refUndo()" ${(m.log||[]).length?'':'disabled'}>↶ Undo last rally</button>
    <button class="btn dgr" onclick="refClear()">Clear</button>
    <button class="btn acc" style="flex:1" onclick="refFinish()">Save &amp; close</button></div>`;

  h+=`<div class="card" style="padding:12px">
    <div class="eyebrow" style="margin-bottom:6px">Reading the court</div>
    <p class="note" style="margin:0"><b>Rally scoring</b> — every rally is a point, whoever served.
    Tap the half of the court belonging to the side that won it. If the receiving side wins, the serve
    crosses with the point. The ball marks the server, who always serves from the right when their own
    score is even, so partners swap sides each time they hold serve.</p>
    <p class="note" style="margin:8px 0 0">Game to ${TARGET}, won by ${WIN_BY} clear points. The two-point
    rule stops at ${GOLDEN}: if both sides reach ${GOLDEN} the very next rally takes it, so no score can go
    past ${CAP}. ${st.rallies} ${st.rallies===1?'rally':'rallies'} recorded — ${st.a}+${st.b}=${st.a+st.b}.</p></div>`;

  h+=`</div></div>`;
  document.getElementById('refRoot').innerHTML=h;
}
/* ===================== score entry focus =====================
   The original Tab bug came from repainting during the browser's own Tab
   handling: `change` fires while focus is in flight, so the box Tab was
   travelling to had already been replaced. The cure was to stop repainting
   during entry — but that left everything derived from a score (standings,
   who advances, the champion) stale until the caret left the box.

   So the repaint is back, on `input` rather than `change`. No input event
   fires while Tab moves focus, so there is no race to lose; and render()
   now puts the caret back exactly where it was, which makes a repaint
   invisible to whoever is typing. */
let pointerDown=false;
const inScoreBox=()=>{ const a=document.activeElement;
  return !!(a&&a.classList&&a.classList.contains('sc')); };

function scoreInput(el){
  const bits=el.dataset.k.split(':'), fld=bits[bits.length-1], ref=bits.slice(0,-1).join(':');
  const m=getMatch(ref); if(!m) return;
  let v=el.value===''?null:Math.max(0,parseInt(el.value,10)||0);
  if(v!=null&&v>CAP){ v=CAP; el.value=String(CAP); }   // 18 is the highest possible score
  if(m[fld]===v) return;
  m[fld]=v; m.log=null;                 // a typed score replaces any rally record
  save();
  render();                             // everything downstream catches up at once
}
/* Enter behaves like Tab — phone keyboards show Go or Done, never a Tab key */
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||!inScoreBox()) return;
  e.preventDefault();
  const list=[...document.querySelectorAll('input.sc:not([disabled])')];
  const i=list.indexOf(e.target), t=list[i+1];
  if(t){ t.focus(); t.select&&t.select(); } else { e.target.blur(); }
},true);
document.addEventListener('pointerdown',()=>{pointerDown=true;},true);
document.addEventListener('pointerup',()=>{pointerDown=false;},true);

/* remember and restore the caret across a repaint */
function grabFocus(){
  const a=document.activeElement;
  if(!a||!a.classList||!a.classList.contains('sc')) return null;
  let s=null,e=null;
  try{ s=a.selectionStart; e=a.selectionEnd; }catch(x){}
  return {k:a.dataset.k,s:s,e:e};
}
function putFocus(f){
  if(!f) return;
  const el=document.querySelector('input.sc[data-k="'+f.k+'"]');
  if(!el||el.disabled) return;
  el.focus();
  if(f.s!=null){ try{ el.setSelectionRange(f.s,f.e); }catch(x){} }
}

/* ===================== render ===================== */
const TABS=[['courts','Courts'],['fixtures','Fixtures'],['table','Standings'],
            ['finals','Finals'],['groups','Groups'],['data','Data']];

function render(){
  const keep=grabFocus();
  applyTheme(); refresh(); save();
  const body=({courts:vCourts,fixtures:vFixtures,table:vTable,
               finals:vFinals,groups:vGroups,data:vData})[S.tab]();
  document.getElementById('wrap').innerHTML=headerHTML()+body+footerHTML();
  document.getElementById('nav').innerHTML=TABS.map(([k,l])=>
    `<button class="${S.tab===k?'on':''}" onclick="go('${k}')">${l}</button>`).join('');
  syncChrome();
  putFocus(keep);
}

function setCourt(g,v){ S.groups[g].court=v.trim()||'Court'; save(); render(); }
function renameTeam(g,i,v){
  const G=S.groups[g], old=G.teams[i], nu=v.trim();
  if(!nu||nu===old){render();return;}
  if(G.teams.some((t,j)=>j!==i&&t===nu)){toast('That pair is already in this group');render();return;}
  G.teams[i]=nu; G.matches.forEach(m=>{if(m.a===old)m.a=nu;if(m.b===old)m.b=nu;});
  save(); render(); toast('Renamed');
}
function addTeam(g){
  const el=document.getElementById('new_'+g), v=(el?el.value:'').trim();
  if(!v){toast('Type a pair name first');return;}
  const G=S.groups[g]; if(G.teams.includes(v)){toast('That pair is already in this group');return;}
  G.teams.push(v); G.matches=buildMatches(G.teams,G.matches);
  save(); render(); toast(v+' added · '+G.matches.length+' matches');
}

/* ========================================================================

   Offline-first: every change writes to this device at once and the tables
   are always right locally. Sync copies changes to the other devices through
   a Supabase table — one row per group and one per knockout score — and merges
   what comes back. A row carries a revision counter; a device only accepts a
   row newer than the one it holds, and the server refuses an older write, so a
   stale device can never overwrite live scoring.

   ===================================================================== */

/* ---------- rows: what travels ---------- */
const K_G  = g => sync.event+':g:'+g;                 // whole group {court,teams,matches}
const K_T  = c => sync.event+':t:'+c;                 // a KO/Gold tie score {sa,sb}
const K_L  = (w,i) => sync.event+':l:'+w+':'+i;       // a league match score {sa,sb}

function groupPayload(g){ const G=S.groups[g];
  return { court:G.court, teams:G.teams.slice(),
    matches:G.matches.map(m=>({n:m.n,a:m.a,b:m.b,sa:m.sa,sb:m.sb,log:m.log||null,
      server:m.server||null,posA:m.posA||0,posB:m.posB||0,startLeft:m.startLeft||null,invert:!!m.invert})) }; }
function tiePayload(c){ const t=S.ko[c]||{};
  return { sa:t.sa==null?null:t.sa, sb:t.sb==null?null:t.sb, log:t.log||null,
    server:t.server||null, posA:t.posA||0, posB:t.posB||0, startLeft:t.startLeft||null, invert:!!t.invert }; }
function leaguePayload(w,i){ const s=(w==='diamond'?S.diamond:S.platinum)[i]||{};
  return { sa:s.sa==null?null:s.sa, sb:s.sb==null?null:s.sb, log:s.log||null,
    server:s.server||null, posA:s.posA||0, posB:s.posB||0, startLeft:s.startLeft||null, invert:!!s.invert }; }

function syncSnapshot(){
  const o={};
  GROUPS.forEach(g=>{ o[K_G(g)]=groupPayload(g); });
  TIE_CODES.forEach(c=>{ o[K_T(c)]=tiePayload(c); });
  ['diamond','platinum'].forEach(w=>[0,1,2].forEach(i=>{ o[K_L(w,i)]=leaguePayload(w,i); }));
  return o;
}
function applyGroup(g,d){ if(!d)return false; const G=S.groups[g]; if(!G)return false;
  if(d.court) G.court=d.court;
  if(Array.isArray(d.teams)) G.teams=d.teams.slice();
  if(Array.isArray(d.matches)) G.matches=d.matches.map(m=>({n:m.n,a:m.a,b:m.b,
    sa:m.sa==null?null:m.sa, sb:m.sb==null?null:m.sb, log:m.log||null,
    server:m.server||null, posA:m.posA||0, posB:m.posB||0, startLeft:m.startLeft||null, invert:!!m.invert}));
  return true; }
function applyTie(c,d){ const t=S.ko[c]||(S.ko[c]={a:'',b:'',sa:null,sb:null,log:null});
  t.sa=d&&d.sa!=null?d.sa:null; t.sb=d&&d.sb!=null?d.sb:null; t.log=(d&&d.log)||null;
  if(d){ t.server=d.server||null; t.posA=d.posA||0; t.posB=d.posB||0; t.startLeft=d.startLeft||null; t.invert=!!d.invert; }
  return true; }
function applyLeague(w,i,d){ const store=w==='diamond'?S.diamond:S.platinum;
  const m=store[i]||(store[i]={a:'',b:'',sa:null,sb:null,log:null});
  m.sa=d&&d.sa!=null?d.sa:null; m.sb=d&&d.sb!=null?d.sb:null; m.log=(d&&d.log)||null;
  if(d){ m.server=d.server||null; m.posA=d.posA||0; m.posB=d.posB||0; m.startLeft=d.startLeft||null; m.invert=!!d.invert; }
  return true; }

function syncScan(){
  if(!sync.on) return;
  const snap=syncSnapshot(), scoring=S.scorer; let n=0;
  Object.keys(snap).forEach(k=>{ const s=JSON.stringify(snap[k]);

    if(!scoring){ sync.sent[k]=s; return; }
    sync.dirty[k]=s; sync.rev[k]=(sync.rev[k]||0)+1; n++; });
  sync.pending=Object.keys(sync.dirty).length;
  if(n) schedulePush();
  syncChrome();
}

async function supa(path,opts){
  const r=await fetch(SUPA_URL+path, Object.assign({
    headers:{ 'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json' } }, opts||{}));
  if(!r.ok) throw new Error('HTTP '+r.status+' '+(await r.text()).slice(0,120));
  const txt=await r.text(); return txt?JSON.parse(txt):null;
}

/* ---------- push ---------- */
function schedulePush(){ clearTimeout(pushTimer); pushTimer=setTimeout(syncPush,PUSH_MS); }
async function syncPush(){
  if(!sync.on||sync.busy) return;
  const keys=Object.keys(sync.dirty); if(!keys.length) return;
  if(!S.scorer){ const snap=syncSnapshot();
    Object.keys(snap).forEach(k=>{ sync.sent[k]=JSON.stringify(snap[k]); });
    sync.dirty={}; sync.pending=0; syncSave(); return; }
  sync.busy=true; syncStatus('sync');
  const batch=keys.slice(0,60);
  const items=batch.map(k=>({key:k,data:JSON.parse(sync.dirty[k]),rev:sync.rev[k]}));
  try{
    const res=await supa('/rest/v1/rpc/osl_put',{method:'POST',
      body:JSON.stringify({items:items, by:sync.device})});
    const ok={}; (res||[]).forEach(r=>ok[r.out_key]=r.out_rev);
    batch.forEach(k=>{ if(ok[k]!==undefined){ sync.sent[k]=sync.dirty[k]; sync.rev[k]=ok[k]; delete sync.dirty[k]; }
      else { delete sync.dirty[k]; } });
    sync.pending=Object.keys(sync.dirty).length;
    sync.lastOk=Date.now(); syncSave(); syncStatus('live');
    syncLog('sent '+batch.length+' change'+(batch.length>1?'s':''));
    if(sync.pending) schedulePush(); else setTimeout(()=>syncPull(false),150);
  }catch(e){ syncLog('send failed: '+(e.message||e)); syncStatus('off_line',String(e.message||e)); }
  finally{ sync.busy=false; }
}

/* ---------- pull ---------- */
async function syncPull(force){
  if(!sync.on||sync.pulling) return;
  sync.pulling=true; if(sync.status!=='live') syncStatus('sync');
  try{
    const since=(force?null:sync.cursor);
    /* Only ever ask for this event's own rows. The table is shared with the
       other RISE apps, so without this filter every device downloads all of
       their rows too and throws them away — wasted bandwidth, and worse, the
       500-row page could fill up with another event's rows and push this
       event's own rows off the end while the cursor moved past them. */
    const q='/rest/v1/osl_live?select=key,data,rev,updated_at&order=updated_at.asc&limit=500'+
      (sync.noFilter?'':'&key=like.'+encodeURIComponent(sync.event+':')+'*')+
      (since?'&updated_at=gt.'+encodeURIComponent(since):'');
    let rows;
    try{ rows=await supa(q); }
    catch(err){
      /* if this server does not accept the filter, fall back once and carry on */
      if(!sync.noFilter && /HTTP 4/.test(String(err.message||err))){
        sync.noFilter=true; syncLog('prefix filter refused — falling back');
        rows=await supa('/rest/v1/osl_live?select=key,data,rev,updated_at&order=updated_at.asc&limit=500'+
          (since?'&updated_at=gt.'+encodeURIComponent(since):''));
      } else throw err;
    }
    let changed=0, newest=sync.cursor;
    (rows||[]).forEach(r=>{
      if(r.key.indexOf(sync.event+':')!==0) return;
      if(!newest||r.updated_at>newest) newest=r.updated_at;
      const localRev=sync.rev[r.key]||0, remoteStr=JSON.stringify(r.data);
      if(r.rev<localRev) return;
      if(r.rev===localRev && sync.sent[r.key]===remoteStr) return;
      if(sync.dirty[r.key]) return;
      const parts=r.key.split(':'), kind=parts[1]; let hit=false;
      if(kind==='g') hit=applyGroup(parts[2], r.data);
      else if(kind==='t') hit=applyTie(parts[2], r.data);
      else if(kind==='l') hit=applyLeague(parts[2], +parts[3], r.data);
      if(!hit) return;
      sync.rev[r.key]=r.rev; sync.sent[r.key]=remoteStr; changed++;
    });
    sync.cursor=newest;
    if(changed){ refresh();
      try{ localStorage.setItem(STORE_KEY, JSON.stringify(Object.assign({},S,{ref:null}))); }catch(e){}
      const snap=syncSnapshot();
      Object.keys(snap).forEach(k=>{ if(!sync.dirty[k]) sync.sent[k]=JSON.stringify(snap[k]); }); }
    sync.lastOk=Date.now(); syncSave(); syncStatus('live');
    syncLog(changed?('received '+changed+' change'+(changed>1?'s':'')):'checked · nothing new');
    if(changed){ if(S.ref) renderRef(); else if(!modalOpen) render(); }
  }catch(e){ syncLog('pull failed: '+(e.message||e)); syncStatus('off_line',String(e.message||e)); }
  finally{ sync.pulling=false; }
}
function syncStart(){ sync.on=true; syncSave(); syncStatus('sync');
  clearInterval(pullTimer); pullTimer=setInterval(()=>syncPull(false),PULL_MS);
  syncPull(true).then(()=>{ syncScan(); }); }
function syncStop(){ sync.on=false; clearInterval(pullTimer); pullTimer=null;
  clearTimeout(pushTimer); syncSave(); syncStatus('off'); }
/* Push whatever is queued, but give up after a few rounds. With no signal the
   queue cannot drain, and an unbounded loop would spin forever; the changes are
   already saved locally and the normal sync will carry them out later anyway. */
async function drainQueue(rounds){
  rounds=rounds||8;
  for(let i=0;i<rounds && sync.on && Object.keys(sync.dirty).length;i++){
    await syncPush();
    if(!Object.keys(sync.dirty).length) break;
    await new Promise(r=>setTimeout(r,150));
  }
  return Object.keys(sync.dirty).length;
}
async function syncPublishAll(){
  if(!sync.on) return toast('Turn live sync on first');
  if(!S.scorer) return toast('Scorer mode only');
  const snap=syncSnapshot();
  Object.keys(snap).forEach(k=>{ sync.rev[k]=(sync.rev[k]||0)+1; sync.dirty[k]=JSON.stringify(snap[k]); });
  sync.pending=Object.keys(sync.dirty).length; toast('Publishing '+sync.pending+' rows…');
  const left=await drainQueue(12);
  toast(left?('Still '+left+' waiting — no connection'):'Published'); if(modalOpen) openModal(syncModal());
}
const syncAlertCls=()=>sync.status==='live'?'ok':(sync.status==='off'?'warn':'bad');
function syncAlertHTML(){
  const ago=sync.lastOk?Math.round((Date.now()-sync.lastOk)/1000)+'s ago':'never';

async function resetEvent(){
  if(!confirm('Reset everything to the original team list?'+(sync.on?' This clears the other devices too.':''))) return;
  const keep={scorer:S.scorer,pin:S.pin,theme:S.theme,mode:S.mode};

  if(sync.on && S.scorer){ const snap=syncSnapshot();
    Object.keys(snap).forEach(k=>{ sync.rev[k]=(sync.rev[k]||0)+1; sync.dirty[k]=JSON.stringify(snap[k]); });
    sync.pending=Object.keys(sync.dirty).length; syncSave(); toast('Reset — clearing the other devices…');

}

/* ========================================================================
   EXPORT & SHARE
   Two routes out of the app. A PDF goes through the browser's own print
   dialog — "Save as PDF" is a destination there on every phone and laptop,
   which keeps this a single offline file with no PDF library bolted on.
   For WhatsApp a plain-text summary works far better than an attachment:
   it is readable in the chat itself, and asterisks give WhatsApp its bold.
   ===================================================================== */
const pad=(s,n)=>{ s=String(s); return s.length>=n?s:s+' '.repeat(n-s.length); };

function txtGroup(g){
  const G=S.groups[g], st=standings(g);
  let t=`*GROUP ${g}* _(${G.court})_\n`;
  const done=G.matches.filter(played).length;
  if(st.length){
    st.forEach(r=>{ t+=`${r.rank}. ${r.team} — ${r.w}W ${r.l}L (${r.d>0?'+':''}${r.d})\n`; });
  }
  if(done){
    t+=`\nResults\n`;
    G.matches.forEach(m=>{ if(!played(m))return;
      t+=`M${m.n} ${m.a} ${m.sa}-${m.sb} ${m.b}\n`; });
  }
  const left=G.matches.length-done;
  if(left) t+=`_${left} match${left>1?'es':''} still to play_\n`;
  return t+'\n';
}
function txtTie(code,label){
  const t=S.ko[code]; if(!t||!t.a||!t.b) return '';
  const p=t.sa!=null&&t.sb!=null;
  return `${label}: ${t.a} ${p?t.sa+'-'+t.sb:'vs'} ${t.b}\n`;
}
function txtFinals(){
  let t='';
  const qf=QF.map(([c])=>txtTie(c,'QF '+c)).join('');
  if(qf) t+=`*QUARTER-FINALS*\n${qf}\n`;
  const sf=SF.map(([c])=>txtTie(c,'SF '+c)).join('');
  if(sf) t+=`*SEMI-FINALS*\n${sf}\n`;
  const lg=(store,src,name)=>{
    const tbl=leagueTable(store,src); if(!tbl.length) return '';
    let s=`*${name} LEAGUE*\n`;
    leaguePairs().forEach((pr,i)=>{ const m=store[i];
      if(m&&m.a&&m.b) s+=`${m.a} ${m.sa!=null&&m.sb!=null?m.sa+'-'+m.sb:'vs'} ${m.b}\n`; });
    s+='\n';
    tbl.forEach(r=>{ s+=`${r.rank}. ${r.team} — ${r.w}W ${r.l}L (${r.d>0?'+':''}${r.d})\n`; });
    return s+'\n';
  };
  t+=lg(S.diamond,DIAMOND_SRC,'DIAMOND');
  t+=lg(S.platinum,PLATINUM_SRC,'PLATINUM');
  const gt=GOLD.map(([c])=>txtTie(c,'Gold '+c)).join('');
  if(gt){
    t+=`*GOLD LEAGUE*\n${gt}`;
    const res=GOLD.map(([c])=>{const x=S.ko[c];
      if(!x||x.sa==null||x.sb==null||!x.a||!x.b)return null;
      const w=x.sa>x.sb?x.a:x.sb>x.sa?x.b:''; return w?{w,m:Math.abs(x.sa-x.sb)}:null;})
      .filter(Boolean).sort((a,b)=>b.m-a.m);
    if(res.length===GOLD.length) t+=`Winner: ${res[0].w} (by ${res[0].m})\n`;
    t+='\n';
  }
  return t;
}
function txtPodium(){
  const dl=leagueTable(S.diamond,DIAMOND_SRC), pl=leagueTable(S.platinum,PLATINUM_SRC);
  const allD=[0,1,2].every(i=>{const m=S.diamond[i];return m&&m.sa!=null&&m.sb!=null;});
  const allP=[0,1,2].every(i=>{const m=S.platinum[i];return m&&m.sa!=null&&m.sb!=null;});
  let t='';
  if(allD&&dl[0]) t+=`🏆 *Diamond champions:* ${dl[0].team}\n🥈 ${dl[1]?dl[1].team:''}\n`;
  if(allP&&pl[0]) t+=`🥇 *Platinum champions:* ${pl[0].team}\n`;
  const res=GOLD.map(([c])=>{const x=S.ko[c];
    if(!x||x.sa==null||x.sb==null||!x.a||!x.b)return null;
    const w=x.sa>x.sb?x.a:x.sb>x.sa?x.b:''; return w?{w,m:Math.abs(x.sa-x.sb)}:null;})
    .filter(Boolean).sort((a,b)=>b.m-a.m);
  if(res.length===GOLD.length) t+=`⭐ *Gold champions:* ${res[0].w}\n`;
  return t?t+'\n':'';
}
function resultsText(scope){
  let done=0,tot=0;
  GROUPS.forEach(g=>S.groups[g].matches.forEach(m=>{tot++;if(played(m))done++;}));
  let t=`*${EVENT_TITLE}* — ${EVENT_SUB}\n`;
  if(scope==='all'||scope==='finals') t+=txtPodium();
  if(scope==='all'||scope==='groups'){
    GROUPS.forEach(g=>{ t+=txtGroup(g); });
  } else if(scope&&scope.length===1){
    t+='\n'+txtGroup(scope);
  }
  if(scope==='all'||scope==='finals') t+=txtFinals();
  if(scope==='all') t+=`_${done} of ${tot} group matches played_\n`;
  t+=`\n${ORGANISER} · ${CONTACT}`;
  return t.replace(/\n{3,}/g,'\n\n');
}

/* ---------- CSV, for a spreadsheet ---------- */
function exportCSV(){
  const q=s=>'"'+String(s==null?'':s).replace(/"/g,'""')+'"';
  const rows=[['Stage','Group/Code','Match','Court','Team A','Score A','Score B','Team B','Winner']];
  GROUPS.forEach(g=>{ const G=S.groups[g];
    G.matches.forEach(m=>rows.push(['Group',g,'M'+m.n,G.court,m.a,
      m.sa==null?'':m.sa, m.sb==null?'':m.sb, m.b,
      played(m)?(m.sa>m.sb?m.a:m.sb>m.sa?m.b:''):''])); });
  TIE_CODES.forEach(c=>{ const t=S.ko[c]; if(!t||!t.a||!t.b)return;
    rows.push([matchTitle('t:'+c).split(' ')[0],c,'','',t.a,
      t.sa==null?'':t.sa,t.sb==null?'':t.sb,t.b,
      (t.sa!=null&&t.sb!=null)?(t.sa>t.sb?t.a:t.sb>t.sa?t.b:''):'']); });
  ['diamond','platinum'].forEach(w=>[0,1,2].forEach(i=>{
    const m=(w==='diamond'?S.diamond:S.platinum)[i]; if(!m||!m.a||!m.b)return;
    rows.push([w==='diamond'?'Diamond':'Platinum','R'+(i+1),'','',m.a,
      m.sa==null?'':m.sa,m.sb==null?'':m.sb,m.b,
      (m.sa!=null&&m.sb!=null)?(m.sa>m.sb?m.a:m.sb>m.sa?m.b:''):'']); }));
  rows.push([]); rows.push(['Standings']);
  rows.push(['Group','Rank','Pair','Played','Won','Lost','For','Against','Diff']);
  GROUPS.forEach(g=>standings(g).forEach(r=>
    rows.push(['Group '+g,r.rank,r.team,r.p,r.w,r.l,r.pf,r.pa,r.d])));
  const csv=rows.map(r=>r.map(q).join(',')).join('\r\n');
  const b=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(b);
  a.download='pickleboss-results-'+new Date().toISOString().slice(0,10)+'.csv';
  a.click(); toast('Spreadsheet exported');
}

/* ========================================================================
   RESETTING SCORES
   Separate from "reset everything". These wipe results while leaving the
   rosters, courts and group layout exactly as they are, so a group can be
   replayed without typing thirty names back in. Clearing a group's scores
   also empties whatever it had fed into the draws, because the qualifiers
   are derived from the group tables rather than stored.
   ===================================================================== */
function wipeMatch(m){
  m.sa=null; m.sb=null; m.log=null;
  m.server=null; m.posA=0; m.posB=0; m.startLeft=null; m.invert=false;
}
function clearGroupScores(g){ S.groups[g].matches.forEach(wipeMatch); }
function clearFinalsScores(){
  TIE_CODES.forEach(c=>{ if(S.ko[c]) wipeMatch(S.ko[c]); });
  [0,1,2].forEach(i=>{ if(S.diamond[i]) wipeMatch(S.diamond[i]);
                       if(S.platinum[i]) wipeMatch(S.platinum[i]); });
}
function scoresIn(scope){
  if(scope==='finals'){
    return TIE_CODES.filter(c=>{const t=S.ko[c];return t&&t.sa!=null&&t.sb!=null;}).length
      +[0,1,2].filter(i=>{const m=S.diamond[i];return m&&m.sa!=null&&m.sb!=null;}).length
      +[0,1,2].filter(i=>{const m=S.platinum[i];return m&&m.sa!=null&&m.sb!=null;}).length;
  }
  if(scope==='groups'||scope==='all'){
    let n=0; GROUPS.forEach(g=>{ n+=S.groups[g].matches.filter(played).length; });
    return n+(scope==='all'?scoresIn('finals'):0);
  }
  return S.groups[scope]?S.groups[scope].matches.filter(played).length:0;
}
async function resetScores(scope){
  if(!S.scorer) return toast('Scorer mode only');
  const n=scoresIn(scope);
  const what = scope==='all'?'every score in the tournament'
    : scope==='groups'?'every group score'
    : scope==='finals'?'every knockout and league score'
    : 'the Group '+scope+' scores';
  if(!n) return toast('Nothing to clear there yet');
  if(!confirm(`Clear ${what}? That is ${n} result${n>1?'s':''}.\n\nTeams, courts and fixtures stay exactly as they are.`
    +(sync.on?'\n\nThis clears them on the other devices too.':''))) return;

  if(scope==='all'){ GROUPS.forEach(clearGroupScores); clearFinalsScores(); }
  else if(scope==='groups'){ GROUPS.forEach(clearGroupScores); }
  else if(scope==='finals'){ clearFinalsScores(); }
  else { clearGroupScores(scope); }

  S.ref=null;
  refresh(); save(); render();
  toast(n+' result'+(n>1?'s':'')+' cleared');
  if(sync.on&&S.scorer) drainQueue(12);   // deliberately not awaited — the UI is already clear
}
function resetModal(){
  const line=(scope,label,note)=>{

    return `<div class="rsRow">
      <div><div class="rsT">${label}</div><div class="rsN">${note}</div></div>
      <button class="btn sm ${n?'dgr':''}" ${n?'':'disabled'} onclick="closeModal();resetScores('${scope}')">
        ${n?'Clear '+n:'Nothing'}</button></div>`;
  };
  return `<h3>Reset scores</h3>
    <p class="hint">Clears results only. Every pair, court and fixture stays put, so the same
    schedule can simply be played again.</p>
    ${line('all','Everything','All groups and the whole knockout')}

    ${GROUPS.map(g=>line(g,'Group '+g,S.groups[g].court)).join('')}

    <button class="btn" style="width:100%;margin-top:10px" onclick="closeModal()">Close</button>`;
}

const halve=a=>[a.slice(0,Math.ceil(a.length/2)),a.slice(Math.ceil(a.length/2))];
function matchCard(g,m,withData){

  const cell=(nm,sc,win)=>`<tr class="${p&&win?'win':''}"><td>${esc(nm)}</td>

    ${cell(m.a,m.sa,p&&m.sa>m.sb)}${cell(m.b,m.sb,p&&m.sb>m.sa)}</table>`;
}
function marginGrid(g,withData){
  const G=S.groups[g], st=withData?standings(g):null, T=G.teams, res={};
  G.matches.forEach(m=>{ if(played(m)){res[m.a+'||'+m.b]=[m.sa,m.sb];res[m.b+'||'+m.a]=[m.sb,m.sa];} });
  const rk={},df={},wn={}; if(st) st.forEach(r=>{rk[r.team]=r.rank;df[r.team]=r.d;wn[r.team]=r.w;});
  return `<div class="gridT"><div class="cap">Score margin</div><table class="grid">
    <tr><th style="text-align:left">Group ${g}</th>${T.map(t=>`<th class="v">${esc(t)}</th>`).join('')}

    ${T.map(r=>`<tr><td class="nm">${esc(r)}</td>
      ${T.map(c=>{ if(r===c)return '<td class="dg"></td>'; const v=withData?res[r+'||'+c]:null;
        return `<td class="c">${v?v[0]+' – '+v[1]:'&nbsp;'}</td>`; }).join('')}
      <td class="tot">${st?wn[r]:'&nbsp;'}</td><td class="tot">${st?(df[r]>0?'+':'')+df[r]:'&nbsp;'}</td>
      <td class="tot">${st?rk[r]:'&nbsp;'}</td><td class="tot">&nbsp;</td></tr>`).join('')}
  </table></div>`;
}

}
function finalsSheet(withData){
  let h=`<div class="psheet">${pageHead('Diamond bracket','Group winners &amp; runners-up · 12 teams')}`;
  h+=`<div class="rlbl">Quarter-finals</div><div class="rows">`+QF.map(([c,x,y])=>koTieBox(c,x,y,withData)).join('')+`</div>`;
  h+=`<div class="rlbl">Semi-finals</div><div class="rows">`+SF.map(([c,x,y])=>koTieBox(c,x,y,withData)).join('')+`</div>`;
  h+=`<div class="rlbl">Diamond league</div><div class="rows">`+[0,1,2].map(i=>leagueBox('diamond',i,withData)).join('')+`</div>`;
  if(withData){ const st=leagueTable(S.diamond,DIAMOND_SRC);
    h+=`<table class="place"><tr><th>Diamond champions</th><td>${st[0]?esc(st[0].team):'&nbsp;'}</td></tr>
      <tr><th>Runners-up</th><td>${st[1]?esc(st[1].team):'&nbsp;'}</td></tr>
      <tr><th>Third</th><td>${st[2]?esc(st[2].team):'&nbsp;'}</td></tr></table>`; }
  h+=pageFoot('')+`</div>`;
  // Platinum + Gold on their own page
  h+=`<div class="psheet pb">${pageHead('Platinum &amp; Gold leagues','Semi-final losers · group thirds')}`;
  h+=`<div class="rlbl">Platinum league</div><div class="rows">`+[0,1,2].map(i=>leagueBox('platinum',i,withData)).join('')+`</div>`;
  if(withData){ const st=leagueTable(S.platinum,PLATINUM_SRC);
    h+=`<table class="place"><tr><th>Platinum champions</th><td>${st[0]?esc(st[0].team):'&nbsp;'}</td></tr></table>`; }
  h+=`<div class="rlbl">Gold league</div><div class="rows">`+GOLD.map(([c,x,y])=>koTieBox(c,x,y,withData)).join('')+`</div>`;
  h+=pageFoot('Gold winner is the victor with the biggest winning margin.')+`</div>`;
  return h;
}

/* a standings-only sheet — the one people actually want after the last match */
function standingsSheet(withData){
  let h=`<div class="psheet">${pageHead('Final standings','All six groups')}`;
  h+=`<div class="cols"><div>`;
  GROUPS.forEach((g,i)=>{
    if(i===3) h+=`</div><div>`;
    const st=standings(g);
    h+=`<h3 style="font:800 10px 'Outfit';letter-spacing:.1em;text-transform:uppercase;margin:0 0 4px">
        Group ${g} <span style="font-weight:400;color:#666">· ${esc(S.groups[g].court)}</span></h3>
      <table class="grid"><tr><th>#</th><th style="text-align:left">Pair</th><th>P</th><th>W</th><th>L</th>
        <th>+</th><th>–</th><th>Diff</th></tr>
      ${st.map(r=>`<tr><td class="c">${r.rank}</td><td class="nm">${esc(r.team)}</td>
        <td class="c">${withData?r.p:''}</td><td class="c">${withData?r.w:''}</td><td class="c">${withData?r.l:''}</td>
        <td class="c">${withData?r.pf:''}</td><td class="c">${withData?r.pa:''}</td>
        <td class="c">${withData?((r.d>0?'+':'')+r.d):''}</td></tr>`).join('')}
      </table><div style="height:8px"></div>`;
  });
  h+=`</div></div>`;
  if(withData){
    const rows=[];
    const dl=leagueTable(S.diamond,DIAMOND_SRC), pl=leagueTable(S.platinum,PLATINUM_SRC);
    if(dl[0]) rows.push(['Diamond champions',dl[0].team],['Diamond runners-up',dl[1]?dl[1].team:'']);
    if(pl[0]) rows.push(['Platinum champions',pl[0].team]);
    const gold=GOLD.map(([c])=>{const t=S.ko[c];
      if(!t||t.sa==null||t.sb==null)return null;
      const w=t.sa>t.sb?t.a:t.sb>t.sa?t.b:''; return w?{w,m:Math.abs(t.sa-t.sb)}:null;})
      .filter(Boolean).sort((a,b)=>b.m-a.m);
    if(gold.length) rows.push(['Gold champions',gold[0].w+' (won by '+gold[0].m+')']);
    if(rows.length) h+=`<table class="place" style="margin-top:6px">`+
      rows.map(([k,v])=>`<tr><th>${k}</th><td>${esc(v)}</td></tr>`).join('')+`</table>`;
  }
  return h+pageFoot('Wins, then point difference, then head-to-head, then points scored.')+`</div>`;
}
/* the team list, for the Groups tab */
function teamsSheet(){
  let h=`<div class="psheet">${pageHead('Teams &amp; courts','Six groups')}`;
  h+=`<div class="cols"><div>`;
  GROUPS.forEach((g,i)=>{
    if(i===3) h+=`</div><div>`;
    const G=S.groups[g];
    h+=`<table class="mc"><tr><th>Group ${g}</th><th class="c">${esc(G.court)}</th></tr>
      ${G.teams.map((t,j)=>`<tr><td>${esc(t)}</td><td class="c">${j+1}</td></tr>`).join('')}
      </table>`;
  });
  h+=`</div></div>`;
  return h+pageFoot('')+`</div>`;
}
function printHTML(withData, only){
  if(only==='finals')    return finalsSheet(withData);
  if(only==='standings') return standingsSheet(withData);
  if(only==='teams')     return teamsSheet();
  if(only)               return groupSheet(only, withData);
  /* the whole book: fixtures, the draws, then the standings summary */
  return GROUPS.map(g=>groupSheet(g,withData)).join('')
       + finalsSheet(withData)
       + (withData?standingsSheet(true):'');
}
function doPrint(mode, only){
  document.getElementById('printArea').innerHTML = printHTML(mode==='data', only);
  window.print();
}

/* ========================= INIT ========================= */
applyTheme();
syncLoad();
if(!Object.keys(sync.sent).length) syncBaseline();
render();
if(sync.on){ syncStatus('sync'); pullTimer=setInterval(()=>syncPull(false),PULL_MS);
  syncPull(true).then(()=>syncScan()); }
else syncStatus('off');
</script>
