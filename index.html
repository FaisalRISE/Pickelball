  h+='<h2 class="sec" style="font-size:19px;margin-top:18px">Sports coverage</h2>';
  h+='<p class="hint">Each player may cover two sports'+(soleWoman(t.id)?', and the team\'s only woman may play all three racket sports':'')+
     '. Tap a sport to name a player or drop them.</p>';

  h+='<div class="covrow">'+SPORT_ORDER.map(sk=>{ const s=SP[sk], n=nomOf(t.id,sk).length;
    const short=s.kind==='racket' ? (nomBy(t.id,sk,'M')<s.minM||nomBy(t.id,sk,'F')<s.minF) : n<s.min;
    return '<div class="covchip'+(short?' short':'')+'" data-sp="'+sk+'">'+
      '<b'+(short?'':' style="color:currentColor"')+'>'+n+'</b><span>'+esc(s.short)+'</span></div>'; }).join('')+'</div>';

  h+='<div class="card" style="margin:9px 0"><div class="eyebrow" style="margin-bottom:6px">Nominated · by gender</div>'+
     '<div class="tw"><table class="gt"><tr><th></th>'+
     SPORT_ORDER.map(sk=>'<th data-sp="'+sk+'">'+esc(SP[sk].short)+'</th>').join('')+'</tr>';
  [['M','Men','minM'],['F','Women','minF']].forEach(g=>{
    h+='<tr><td class="'+(g[0]==='F'?'gsym f':'gsym m')+'" style="background:none;color:inherit">'+g[1]+'</td>'+
      SPORT_ORDER.map(sk=>{ const s=SP[sk], n=nomBy(t.id,sk,g[0]);
        const bad = s.kind==='racket' && n<s[g[2]];
        return '<td class="'+(bad?'bad':(n?'':'zero'))+'"><b>'+n+'</b></td>'; }).join('')+'</tr>';
  });
  h+='<tr class="tot"><td>Total</td>'+SPORT_ORDER.map(sk=>{ const s=SP[sk], n=nomOf(t.id,sk).length;
    return '<td><b>'+n+'</b> <span class="dim" style="font-size:9px">/'+s.max+'</span></td>'; }).join('')+'</tr>';
  h+='<tr><td class="dim">Need</td>'+SPORT_ORDER.map(sk=>{ const s=SP[sk];
    return '<td class="dim" style="font-size:10px">'+(s.kind==='racket'?'5M+1F':s.min)+'</td>'; }).join('')+'</tr>';
  h+='</table></div></div>';

  if(issues.length) h+='<div class="alert bad"><span>⚠</span><span>'+issues.map(esc).join('<br>')+'</span></div>';
  else h+='<div class="alert ok"><span>✓</span><span>Squad is legal for all five sports.</span></div>';

  if(canEdit()) h+='<div class="row" style="margin:10px 0"><button class="btn sm grow" data-auto="'+t.id+'">Auto-fill nominations</button>'+
    '<button class="btn sm grow" data-clearnom="'+t.id+'">Clear all</button></div>';

  h+=participationBlock(t);
  h+='<div class="row" style="margin:12px 0"><button class="btn sm grow" data-pdf="'+t.id+'">'+
     'Export this team sheet</button><button class="btn sm grow" data-pdf="all">Export all eight</button></div>';

  /* --- squad rows --- */
  const row=p=>{
    const out=isOut(t.id,p.id), mine=sportsOfPlayer(t.id,p.id);
    let x='<div class="rp2'+(out?' out':'')+'">';
    x+='<span class="who"><b>'+esc(p.name)+'</b>'+(p.owner?' <span class="owner">Owner</span>':'')+
       '<span class="meta2"><span class="cat '+(p.g==='F'?'w':'m')+'">'+esc(CATS[p.cat].label)+'</span>'+
       '<span class="gsym '+(p.g==='F'?'f':'m')+'">'+(p.g==='F'?'Woman':'Man')+'</span>'+
       (out?'<span class="gsym f">Unavailable</span>'
           :'<span class="dim" style="font-size:10px">'+(mine.length?mine.length+' of '+capFor(t.id,p.id)+' sports':'no sport yet')+'</span>')+
       '</span></span>';
    x+='<span class="spx">'+SPORT_ORDER.map(sk=>{
      const on=mine.includes(sk), blocked=nomBlock(t.id,sk,p.id);
      return '<span class="spb'+(on?' on':'')+(blocked?' lock':'')+(canEdit()&&!out?' tap':'')+'" data-sp="'+sk+'" '+
        (canEdit()&&!out?'data-nom="'+t.id+'|'+sk+'|'+p.id+'"':'')+' title="'+esc(blocked||SP[sk].name)+'">'+
        '<span class="lg">'+esc(SP[sk].name)+'</span><span class="sh">'+sk+'</span></span>'; }).join('')+'</span>';
    if(canEdit()) x+='<button class="availb'+(out?' out':'')+'" data-avail="'+t.id+'|'+p.id+'|'+(out?'in':'out')+'">'+
      (out?'Mark available':'Unavailable')+'</button>';
    return x+'</div>';
  };

  h+='<div class="eyebrow" style="margin:18px 2px 5px">Squad · '+inSquad.length+' available</div>';
  h+='<div class="card flat" style="margin:0"><div class="roster">'+inSquad.map(row).join('')+'</div></div>';
  if(outSquad.length){
    h+='<div class="eyebrow" style="margin:18px 2px 5px">Not available on match day · '+outSquad.length+'</div>';
    h+='<p class="hint" style="margin:0 2px 6px">Left out of every count and quota until they are marked back in.</p>';
    h+='<div class="card flat" style="margin:0"><div class="roster">'+outSquad.map(row).join('')+'</div></div>';
  }
  return h;
}

/* ============================ TEAM SHEET (PRINT / PDF) ============================
   Rendered into a hidden block and handed to the browser's print dialog, which
   every phone and laptop can save as a PDF. No library, nothing to download. */
function teamSheet(t){
  const pr=participation(t.id), issues=nomIssues(t.id), inSq=squadIn(t), outSq=squadOut(t);
  const d=new Date(), stamp=d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})+
    ' · '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
  let h='<div class="sheet">';
  h+='<div class="phd"><img src="'+LOGO+'" alt=""><div><h1>'+esc(t.name)+'</h1>'+
     '<div class="sub">Odyssey Sports League 2026 · Team Sheet</div></div>'+
     '<div class="rt">'+esc(t.owners)+'<br>Printed '+esc(stamp)+'</div></div>';

  h+='<h2>Nominations by sport</h2><table><tr><th>Sport</th><th class="c">Req</th><th class="c">M</th>'+
     '<th class="c">W</th><th>Players nominated</th></tr>';
  SPORT_ORDER.forEach(sk=>{
    const sp=SP[sk], list=nomOf(t.id,sk);
    const names=list.map(pid=>esc(pName(pid))+(pOf(pid).g==='F'?' (W)':'')).join(', ')||'—';
    h+='<tr><td><b>'+esc(sp.name)+'</b></td><td class="c">'+(sp.kind==='racket'?'5M+1F':sp.min)+'</td>'+
      '<td class="c">'+nomBy(t.id,sk,'M')+'</td><td class="c">'+nomBy(t.id,sk,'F')+'</td>'+
      '<td>'+names+'</td></tr>';
  });
  h+='</table><p class="note">Racket sports: 6 compulsory (5 men + 1 woman), up to 8. Carrom 2–4, Chess 1–2, both gender-neutral. '+
     'Maximum two sports per player; a team\'s only available woman may play all three racket sports.</p>';

  h+='<h2>Squad · '+inSq.length+' available'+(outSq.length?' · '+outSq.length+' unavailable':'')+'</h2>';
  h+='<table><tr><th>#</th><th>Player</th><th>Category</th><th class="c">M/W</th>'+
     SPORT_ORDER.map(k=>'<th class="c">'+k+'</th>').join('')+'<th class="c">Sports</th><th class="c">Played</th></tr>';
  const line=(p,i,out)=>{
    const mine=sportsOfPlayer(t.id,p.id), pl=playedSports(t.id,p.id);
    return '<tr'+(out?' class="out"':'')+'><td class="c">'+i+'</td>'+
      '<td>'+esc(p.name)+(p.owner?' <b>(Owner)</b>':'')+(out?' — unavailable':'')+'</td>'+
      '<td>'+esc(CATS[p.cat].label)+'</td><td class="c">'+(p.g==='F'?'W':'M')+'</td>'+
      SPORT_ORDER.map(k=>'<td class="c '+(mine.indexOf(k)>=0?'yes':'no')+'">'+(mine.indexOf(k)>=0?'●':'·')+'</td>').join('')+
      '<td class="c">'+mine.length+'</td><td class="c">'+(pl.length?pl.join(' '):'—')+'</td></tr>';
  };
  inSq.forEach((p,i)=>h+=line(p,i+1,false));
  outSq.forEach((p,i)=>h+=line(p,inSq.length+i+1,true));
  h+='</table>';

  h+='<h2>Compliance</h2>';
  if(issues.length) h+='<div class="warn"><b>Nomination issues</b><br>'+issues.map(esc).join('<br>')+'</div>';
  else h+='<div class="okbox"><b>Nominations legal for all five sports.</b></div>';
  h+='<div class="'+(pr.breach.length?'warn':'okbox')+'"><b>§3.1 everyone plays once — '+
     pr.played.length+' of '+pr.squad+' available players have taken the court.</b>'+
     (pr.waiting.length?'<br>Still to play: '+pr.waiting.map(p=>esc(p.name)).join(', '):'')+
     (pr.breach.length?'<br><b>Breach — can no longer play: '+pr.breach.map(p=>esc(p.name)).join(', ')+'</b>':'')+
     '</div>';
  if(penOf(t.id)) h+='<div class="warn"><b>Penalty: −'+penOf(t.id)+' championship points.</b>'+
     (penNote(t.id)?' '+esc(penNote(t.id)):'')+'</div>';

  h+='<div class="sign"><div>Team Captain — name &amp; signature</div>'+
     '<div>Sports Committee — name &amp; signature</div></div>';
  return h+'</div>';
}

function printSheets(){
  if(!state.print) return '';
  const list=state.print==='all'?TEAMS:[teamById(state.print)].filter(Boolean);
  return list.map(teamSheet).join('');
}
/* Paint the sheets, let the browser lay them out, then open the print dialog —
   "Save as PDF" on desktop, Share → Print on a phone. */
function doPrint(which){
  state.print=which; render();
  setTimeout(()=>{ window.print();
    setTimeout(()=>{ state.print=null; render(); },400); },160);
}

 '<circle cx="8.4" cy="8.4" r="1.5" fill="#c9b800"/><circle cx="15.4" cy="8" r="1.4" fill="#c9b800"/>'+

 'stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-1px"><polyline points="16 3 21 3 21 8"/>'+

function boxHTML(m,tid,pos,cs,locked,fresh){
  const idx=cs.slot[tid][pos], pid=(m.lineup[tid]||[])[slotAt(cs.phase,idx)];
  const key=(tid===m.a)?'a':'b', p=pOf(pid);
  const isServer=(cs.serving===key)&&(cs.pos===pos)&&!overOf(m);
  const dead=(!canEdit()||overOf(m)||locked);
  return '<div class="box'+(dead?' locked':'')+(fresh?' justin':'')+
      '" '+(dead?(canEdit()?'':'data-noedit="1"'):'data-tap="'+m.id+'|'+tid+'"')+'>'+
    '<div class="posTag">'+(pos==='R'?'Right / even':'Left / odd')+'</div>'+
    '<div class="pSlot">'+(isServer?'<span class="ball">'+BALL+'</span>':'')+
      '<span class="sl">'+PAIR_LABEL[cs.phase].slice(-1)+(idx+1)+'</span>'+
      '<span class="pn">'+esc(pName(pid))+'</span>'+
      (p?'<span class="pTag">'+esc(CATS[p.cat].short)+'</span>':'')+'</div>'+
    (isServer?'<div class="servetag">serving from the '+(pos==='R'?'right':'left')+'</div>':'')+'</div>';
}

function viewRacketMatch(m){
  const A=teamById(m.a), B=teamById(m.b);
  let h=matchHead(m);
  if(!A||!B) return h+'<div class="empty"><b>Waiting on the groups</b>This slot fills automatically once the group matches are done.</div>';

  const sc=scoreOf(m), lead=Math.max(sc.a,sc.b), over=overOf(m), w=racketWinner(m);
  const ready=lineupReady(m), pend=subPending(m), cs=courtState(m);
  const iss=[].concat(lineupIssues(m,m.a).map(s=>A.name+': '+s), lineupIssues(m,m.b).map(s=>B.name+': '+s));
  const finalOv=(state.finalFor===m.id)?finalScoreOverlay(m):'';

  if(canEdit()) h+='<div class="row" style="gap:7px;margin-top:11px;flex-wrap:wrap">'+
    '<button class="btn sm" data-lineup="'+m.id+'">Line-ups</button>'+
    '<button class="btn sm" data-openfinal="'+m.id+'">Final score</button>'+
    (over?'<button class="btn sm" data-sharematch="'+m.id+'">Share</button>':'')+
    '<span class="grow"></span><button class="btn sm dan" data-reset="'+m.id+'">Reset</button></div>';

  if(!ready){
    h+='<div class="alert warn"><span>⚠</span><span>Set both line-ups before scoring — three pairs each, '+
      'at least one woman in the six, and no two women paired (§3.1, §3.2).</span></div>';
    if(iss.length) h+='<div class="alert bad"><span>⚠</span><span>'+iss.map(esc).join('<br>')+'</span></div>';
    if(canEdit()) h+='<button class="btn pri" style="width:100%" data-lineup="'+m.id+'">Set the line-ups</button>';
    else h+='<p class="hint">Turn on Scorer mode in settings to set line-ups and score this match.</p>';
    return h+finalOv;
  }

  /* Ends change at 14 (§5.6). Score panels, court halves and the +/− rows all follow
     the same left/right order, so the referee always taps the side a team stands on. */
  const ends=lead>=SWITCH_AT;
  const baseLeftIsA=((m.startLeft||m.a)===m.a);
  let leftT=ends?(baseLeftIsA?B:A):(baseLeftIsA?A:B);
  let rightT=(leftT===A)?B:A;
  if(m.invert){ const sw=leftT; leftT=rightT; rightT=sw; }
  const scoreOfT=t=>(t.id===m.a)?sc.a:sc.b;

  if(over){
    const wt=teamById(w==='a'?m.a:m.b);
    h+='<div class="alert ok"><span>🏆</span><span><b>'+esc(wt.name)+'</b> win '+lead+'–'+Math.min(sc.a,sc.b)+'.'+
      (lead===TARGET&&Math.min(sc.a,sc.b)===GOLDEN?' Decided on the golden point.':'')+'</span></div>';
  }

  h+='<div class="scorestrip">'+
    '<div class="sTeam"><div class="stripe" style="background:'+leftT.hex+'"></div>'+
      '<div class="nm">'+esc(leftT.name)+'</div>'+
      '<div class="num" style="color:'+tcol(leftT)+'">'+scoreOfT(leftT)+'</div></div>'+
    '<div class="phasebox"><div class="cv">'+PAIR_LABEL[cs.phase].slice(-1)+'</div>'+
      '<div class="cl">Pair</div></div>'+
    '<div class="sTeam right"><div class="stripe" style="background:'+rightT.hex+'"></div>'+
      '<div class="nm">'+esc(rightT.name)+'</div>'+
      '<div class="num" style="color:'+tcol(rightT)+'">'+scoreOfT(rightT)+'</div></div></div>';

  /* pre-match set-up — locks the moment the first point is scored */
  if(!(m.log||[]).length && canEdit() && !over){
    h+='<div class="tossbar"><span class="eyebrow">Serves first</span>'+
      [leftT,rightT].map(t=>{ const on=((m.server||'a')===(t.id===m.a?'a':'b'));
        return '<button class="btn sm'+(on?' pri':'')+'" data-serve="'+m.id+'|'+t.id+'">'+
          (on?BALL+' ':'')+esc(t.name)+'</button>'; }).join('')+
      '<span class="dim" style="font-size:10.5px;font-weight:600">first server starts on the right</span></div>';
    h+='<div class="tossbar"><span class="eyebrow">Court sides</span>'+
      '<span style="font-size:12px;font-weight:700">'+swatch(leftT)+' '+esc(leftT.name)+' <span class="dim">left</span>'+
      ' &nbsp;·&nbsp; '+swatch(rightT)+' '+esc(rightT.name)+' <span class="dim">right</span></span>'+
      '<button class="btn sm" data-startside="'+m.id+'">'+SWAP+' Swap</button>'+
      '<span class="dim" style="font-size:10.5px;font-weight:600">set this to match where the teams actually stand</span></div>';
    h+='<div class="tossbar"><span class="eyebrow">Pair A positions</span>'+
      [leftT,rightT].map(t=>'<span style="font-size:11.5px;font-weight:700">'+swatch(t)+' '+esc(t.name)+
        ' <span class="dim">'+esc(pName(m.lineup[t.id][slotAt(0,rightOf(m,t.id,0))]))+' right</span> '+
        '<button class="btn sm" data-posflip="'+m.id+'|'+t.id+'|0">'+SWAP+'</button></span>').join('')+
      '<span class="dim" style="font-size:10.5px;font-weight:600">the pair chooses its starting server (§5.1)</span></div>';
  }

  if(sc.a===GOLDEN&&sc.b===GOLDEN&&!over)
    h+='<div class="alert bad"><span>⚡</span><span><b>Golden point</b> — the next rally wins the match (§3.3).</span></div>';

  h+='<div class="court" data-sport="'+m.sport+'">'+
    '<div class="half a">'+boxHTML(m,leftT.id,'L',cs,!!pend,!!pend)+boxHTML(m,leftT.id,'R',cs,!!pend,!!pend)+
      '<div class="kitchen"></div><div class="taphint">'+
      (canEdit()&&!over&&!pend?'tap = +1 ':'')+esc(leftT.name)+'</div></div>'+
    '<div class="net"></div>'+
    '<div class="half b">'+boxHTML(m,rightT.id,'R',cs,!!pend,!!pend)+boxHTML(m,rightT.id,'L',cs,!!pend,!!pend)+
      '<div class="kitchen"></div><div class="taphint">'+
      (canEdit()&&!over&&!pend?'tap = +1 ':'')+esc(rightT.name)+'</div></div></div>';

  h+='<div class="endsnote">'+
    (ends?('<span>'+SWAP+' Ends changed at '+SWITCH_AT+' — '+esc(leftT.name)+' now on the left</span>'):'<span></span>')+
    (canEdit()?'<button class="btn sm'+(m.invert?' pri':'')+'" data-invert="'+m.id+'">'+SWAP+
      ' '+(m.invert?'View flipped':'Flip my view')+'</button>':'')+'</div>';

  if(canEdit()){
    h+='<div class="ctrls">'+[leftT,rightT].map(t=>{
      const mine=(t.id===m.a)?sc.a:sc.b;
      return '<div class="ctrlrow">'+
        '<button class="rbtn" data-minus="'+m.id+'|'+t.id+'"'+(mine===0?' disabled':'')+'>−</button>'+
        '<div class="tl">'+esc(t.name)+'</div>'+
        '<button class="rbtn plus" data-tap="'+m.id+'|'+t.id+'"'+((over||pend)?' disabled':'')+
        ' style="background:'+t.hex+'">+</button></div>'; }).join('')+'</div>';
    if((m.log||[]).length) h+='<div class="row" style="gap:7px;margin-bottom:10px">'+
      '<button class="btn sm" data-undo="'+m.id+'">Undo last point</button></div>';
  } else h+='<p class="hint" style="margin-bottom:10px">Turn on Scorer mode in settings to record points.</p>';

  /* rotation ladder — the leading score is the clock (§3.2) */
  const lo=[0,GATE1,GATE2], hi=[GATE1,GATE2,TARGET];
  h+='<div class="rotwrap"><div class="rothead"><span class="eyebrow">On court</span>'+
    '<span class="big">'+PAIR_LABEL[cs.phase]+'</span>'+
    '<span class="dim" style="font-size:11px;font-weight:600;margin-left:auto">rotation follows the leading score</span></div>'+
    '<div class="ladder">'+[0,1,2].map(i=>{
      const pct=Math.max(0,Math.min(100,(lead-lo[i])/(hi[i]-lo[i])*100));
      return '<div class="gate'+(i===cs.phase?' cur':'')+(lead>=hi[i]?' done':'')+'">'+
        '<div class="bar"><div class="fill" style="width:'+pct+'%"></div>'+
        '<div class="pair">'+PAIR_LABEL[i]+'</div></div>'+
        '<div class="tick">'+PAIR_RANGE[i]+'</div></div>'; }).join('')+'</div>';
  if(over) h+='<div class="countdown">Match complete.</div>';
  else if(pend) h+='<div class="countdown"><b>'+PAIR_LABEL[cs.phase]+'</b> is due on — confirm the rotation to resume.</div>';
  else { const nxt=cs.phase<2?hi[cs.phase]:TARGET, togo=nxt-lead;
    h+='<div class="countdown"><b>'+togo+'</b> '+(togo===1?'point':'points')+
      (cs.phase<2?' to '+PAIR_LABEL[cs.phase+1]+' (leader reaches '+nxt+')'
                 :' to win (first to '+TARGET+')')+'</div>'; }
  h+='</div>';

  /* off-court pairs */
  h+='<div class="ctrls">'+[leftT,rightT].map(t=>{
    const lu=m.lineup[t.id];
    return '<div class="card" style="margin:0;padding:10px 12px"><div class="eyebrow" style="margin-bottom:6px">'+
      esc(t.name)+' · off court</div><div style="display:flex;flex-wrap:wrap;gap:5px">'+
      [0,1,2].filter(i=>i!==cs.phase).map(i=>'<span class="chip" style="cursor:default;font-size:10.5px;padding:4px 9px">'+
        PAIR_LABEL[i].slice(-1)+' · '+esc(pName(lu[i*2]))+' &amp; '+esc(pName(lu[i*2+1]))+'</span>').join('')+
      '</div></div>'; }).join('')+'</div>';

  if(iss.length) h+='<div class="alert bad"><span>⚠</span><span>'+iss.map(esc).join('<br>')+'</span></div>';

  if((m.log||[]).length){
    h+='<div class="eyebrow" style="margin:18px 2px 5px">Rally log</div>'+
       '<div class="card" style="margin:0;font-size:11px;line-height:1.9">';
    let a=0,b=0;
    h+=m.log.map(x=>{ x==='a'?a++:b++; const g=(Math.max(a,b)===GATE1||Math.max(a,b)===GATE2);
      return '<span style="color:'+tcol(x==='a'?A:B)+'">'+a+'-'+b+'</span>'+(g?' <span class="dim">↻</span>':''); }).join(' · ');
    h+='</div>';
  }

  if(finalOv) h+=finalOv;
  else if(pend) h+=rotationOverlay(m,pend,cs,leftT,rightT);
  return h;
}

/* A read-only picture of the court for the pair that is coming on, so the
   referee can check the two players are standing where the card says. */
function miniCourt(m,ph,leftT,rightT){
  const cell=(tid,side)=>{
    const lu=m.lineup[tid], r=rightOf(m,tid,ph);
    const pid=lu[slotAt(ph,side==='R'?r:1-r)], p=pOf(pid);
    return '<div class="box locked"><div class="posTag">'+(side==='R'?'Right court':'Left court')+'</div>'+
      '<div class="pSlot"><span class="sl">'+PAIR_LABEL[ph].slice(-1)+(side==='R'?'1':'2')+'</span>'+
      '<span class="pn">'+esc(pName(pid))+'</span>'+
      (p&&p.g==='F'?'<span class="pTag">W</span>':'')+'</div></div>';
  };
  return '<div class="mcwrap"><div class="mclegend">Where <b>'+PAIR_LABEL[ph]+'</b> stands</div>'+
    '<div class="court mini" data-sport="'+m.sport+'">'+
    '<div class="half a">'+cell(leftT.id,'L')+cell(leftT.id,'R')+
      '<div class="kitchen"></div><div class="taphint">'+esc(leftT.name)+'</div></div>'+
    '<div class="net"></div>'+
    '<div class="half b">'+cell(rightT.id,'R')+cell(rightT.id,'L')+
      '<div class="kitchen"></div><div class="taphint">'+esc(rightT.name)+'</div></div></div></div>';
}

/* Blocking rotation confirmation — scoring stays locked until the referee confirms
   the new pair is on court (and, at 14, that the teams have changed ends). */
function rotationOverlay(m,gate,cs,leftT,rightT){
  const ph=cs.phase, isEnds=(gate===SWITCH_AT);
  const row=tid=>{
    const t=teamById(tid), lu=m.lineup[tid], r=rightOf(m,tid,ph);
    return '<div class="subrow"><div class="subteam">'+swatch(t)+esc(t.name)+'</div>'+
      '<div class="subswap">'+
        '<span class="off"><span class="tag">OFF</span>'+PAIR_LABEL[ph-1]+' · '+
          esc(pName(lu[(ph-1)*2]))+' &amp; '+esc(pName(lu[(ph-1)*2+1]))+'</span>'+
        '<span class="arrow">→</span>'+
        '<span class="on"><span class="tag">ON</span>'+PAIR_LABEL[ph]+' · <b>'+
          esc(pName(lu[slotAt(ph,r)]))+'</b> right, <b>'+esc(pName(lu[slotAt(ph,1-r)]))+'</b> left</span>'+
      '</div>'+
      (canEdit()?'<button class="btn sm" style="margin-top:8px" data-posflip="'+m.id+'|'+tid+'|'+ph+'">'+
        SWAP+' Swap who starts right</button>':'')+'</div>';
  };
  return '<div class="subov"><div class="subcard'+(isEnds?' ends':'')+'">'+
    '<div class="subgate">'+PAIR_LABEL[ph]+' on court · '+gate+' reached</div>'+
    '<div class="subpair">'+(isEnds
      ? 'Teams change ends at '+SWITCH_AT+' — the pair change and the end change happen together (§5.6)'
      : 'The score is not reset — '+PAIR_LABEL[ph]+' picks up from '+gate+' (§3.2)')+'</div>'+
    (isEnds?'<div class="subrow"><div class="subswap" style="justify-content:center">'+
      '<span class="on">'+swatch(leftT)+' '+esc(leftT.name)+' <b>→ left</b></span>'+
      '<span class="arrow">·</span>'+
      '<span class="on">'+swatch(rightT)+' '+esc(rightT.name)+' <b>→ right</b></span></div></div>':'')+
    miniCourt(m,ph,leftT,rightT)+
    row(m.a)+row(m.b)+
    (canEdit()?'<button class="bigbtn" data-acksub="'+m.id+'|'+gate+'">✓ '+
      (isEnds?'Ends changed and '+PAIR_LABEL[ph]+' on — resume':PAIR_LABEL[ph]+' on court — resume play')+'</button>':'')+
    '<div class="subnote">Scoring is paused until this is confirmed. '+
      '<b id="swtimer">'+SWITCH_SECONDS+'s</b> to take position — after that the referee may award a penalty point (§3.4).</div>'+
  '</div></div>';
}

function viewMatch(){
  const m=state.matches.find(x=>x.id===state.openMatch);
  if(!m) return viewFixtures();
  if(SP[m.sport].kind==='racket') return viewRacketMatch(m);
  return m.sport==='CR'?viewCarromMatch(m):viewChessMatch(m);
}

/* Who may still be dropped into this slot: nominated, available, and not
   already standing in another slot. The sport's marquee only appears in Pair C. */
function slotOptions(m,tid,slot){
  const l=(m.lineup&&m.lineup[tid])||[], used=l.filter((x,i)=>x&&i!==slot);
  const mq=marqueeOf(tid,m.sport), inPairC=slot>=4;
  const partner=l[slot%2===0?slot+1:slot-1];
  const partnerIsWoman=partner&&pOf(partner)&&pOf(partner).g==='F';
  return nomOf(tid,m.sport).filter(pid=>{
    if(used.includes(pid)) return false;                 // already on court elsewhere
    if(isOut(tid,pid)) return false;                     // unavailable on match day
    if(pid===mq && !inPairC) return false;               // marquee closes in Pair C
    if(partnerIsWoman && pOf(pid).g==='F') return false; // two women cannot pair
    return true;
  });
}

function lineupModal(m){
  const teams=[teamById(m.a),teamById(m.b)];
  let h='<h3>Line-ups</h3><p class="hint" style="margin-bottom:10px">Three pairs each, in the order they take the court. '+
    'Pair A plays to 7, Pair B to 14, Pair C to 25. The sport\'s marquee closes in Pair C, '+
    'and each woman plays in a mixed pair.</p>';
  teams.forEach(t=>{
    const nom=nomOf(t.id,m.sport), l=(m.lineup&&m.lineup[t.id])||[], mq=marqueeOf(t.id,m.sport);
    h+='<div class="row" style="margin:14px 0 4px">'+swatch(t)+'<b style="color:'+tcol(t)+'">'+esc(t.name)+'</b>'+
      '<span class="grow"></span><span class="dim" style="font-size:11px">'+
      l.filter(Boolean).length+' of 6 named</span></div>';
    if(nom.length<6) h+='<div class="alert bad"><span>⚠</span><span>Only '+nom.length+
      ' nominated for '+esc(SP[m.sport].name)+' — six must take the court. Set it on the team page.</span></div>';
    [0,1,2].forEach(pi=>{
      h+='<div class="pairbox"><div class="ph">'+PAIR_LABEL[pi]+' · '+(pi===0?'0 to 7':pi===1?'7 to 14':'14 to 25')+
        (pi===2&&mq?' · marquee closes here':'')+'</div>';
      [0,1].forEach(si=>{ const slot=pi*2+si, cur=l[slot]||'';
        const opts=slotOptions(m,t.id,slot);
        if(cur && !opts.includes(cur)) opts.unshift(cur);
        h+='<div class="pl"><select data-lp="'+m.id+'|'+t.id+'|'+slot+'"><option value="">— empty —</option>'+
          opts.map(pid=>{ const p=pOf(pid);
            return '<option value="'+pid+'"'+(cur===pid?' selected':'')+'>'+esc(p.name)+' · '+
              esc(CATS[p.cat].short)+(pid===mq?' ★':'')+'</option>'; }).join('')+
          '</select></div>'; });
      h+='</div>';
    });
    const iss=lineupIssues(m,t.id);
    if(iss.length) h+='<div class="alert bad"><span>⚠</span><span>'+iss.map(esc).join('<br>')+'</span></div>';
    else h+='<div class="alert ok"><span>✓</span><span>Legal line-up.</span></div>';
  });
  h+='<div class="row" style="margin-top:14px"><button class="btn grow" data-autolineup="'+m.id+'">Suggest line-ups</button>'+
     '<button class="btn pri grow" data-close="1">Done</button></div>';
  return h;
}

/* Suggest a legal line-up: the sport's marquee closes in Pair C alongside the
   lead woman, a second woman goes into a different pair, everyone else fills in. */
function autoLineup(m,tid){
  const nom=nomOf(tid,m.sport).filter(p=>isIn(tid,p));
  if(nom.length<6) return false;
  const rank={MPB:0,MTT:0,MBM:0,GA:1,WM:2,GB:3,WG:4};
  /* In the group stage the suggestion favours squad members who have not been
     on court yet, which is how a team satisfies §3.1 without anyone tracking it
     by hand. Knockouts ignore that and pick the strongest legal six (§2.6). */
  const spread = (m.stage==='group'||m.stage==='league');
  const by=g=>nom.filter(p=>pOf(p).g===g).sort((x,y)=>
    (spread?(hasPlayed(tid,x)?1:0)-(hasPlayed(tid,y)?1:0):0) || rank[pOf(x).cat]-rank[pOf(y).cat]);
  let men=by('M'), wom=by('F');
  if(!wom.length||men.length<4) return false;
  const mq=marqueeOf(tid,m.sport);
  if(mq && men.includes(mq)) men=[mq].concat(men.filter(p=>p!==mq));   // marquee first in hand
  const six=[null,null,null,null,null,null];
  if(mq && men.includes(mq)){ six[4]=mq; men=men.filter(p=>p!==mq); }
  six[5]=wom[0]; wom=wom.slice(1);                    // lead woman closes in the mixed Pair C
  if(wom.length){ six[1]=wom[0]; wom=wom.slice(1); }  // second woman into Pair A, mixed
  [0,2,3,4,1].forEach(i=>{ if(six[i]==null && men.length) six[i]=men.shift(); });
  if(six.some(x=>!x)) return false;
  m.lineup=Object.assign({},m.lineup); m.lineup[tid]=six; return true;
}

   and the tables are always correct locally. Sync copies those changes to the
   other devices through a Supabase table, one row per match / team, and merges
   what comes back. If the venue wifi drops, scoring carries on and the backlog
   goes up the moment the connection returns.

   row whose revision is higher than the one it holds, and the server refuses a

function matchPayload(m){
  return { a:m.a||null, b:m.b||null, done:!!m.done,
           log:m.log||null, lineup:m.lineup||null, acked:m.acked||null, pos:m.pos||null,
           startLeft:m.startLeft||null, invert:!!m.invert,
           boards:m.boards||null, pairs:m.pairs||null,
           result:m.result===undefined?null:m.result, players:m.players||null };
}
function applyMatch(id,d){
  const m=state.matches.find(x=>x.id===id); if(!m||!d) return false;
  if(d.a!==undefined&&d.a) m.a=d.a; if(d.b!==undefined&&d.b) m.b=d.b;
  ['log','lineup','acked','pos','startLeft','boards','pairs','players'].forEach(k=>{
    if(d[k]!==undefined&&d[k]!==null) m[k]=d[k]; });
  if(d.result!==undefined) m.result=d.result;
  m.invert=!!d.invert; m.done=!!d.done;
  return true;
}

/* Every syncable row, as a { key: payloadObject } map. */
function syncSnapshot(){
  const o={};
  state.matches.forEach(m=>{ o[K_MATCH(m.id)]=matchPayload(m); });
  TEAMS.forEach(t=>{ o[K_NOM(t.id)]=state.nom[t.id]||{};
                     o[K_AV(t.id)]=state.avail[t.id]||{};
                     o[K_PEN(t.id)]=state.pen[t.id]||{}; });

}

/* Compare the current state with what this device last sent and queue the
   difference. Called after every save, so no scoring code has to remember to. */
function syncScan(){
  if(!sync.on) return;
  const snap=syncSnapshot(), scoring=state.scorer; let n=0;
  Object.keys(snap).forEach(k=>{
    const s=JSON.stringify(snap[k]);
    if(sync.sent[k]===s) return;
    if(!scoring){ sync.sent[k]=s; return; }   // a viewing device never publishes
    sync.dirty[k]=s; sync.rev[k]=(sync.rev[k]||0)+1; n++;
  });
  sync.pending=Object.keys(sync.dirty).length;
  if(n) schedulePush();
}
/* First run on a device that has never synced: adopt the current state as the
   baseline instead of flooding the table with 100+ untouched fixtures. */

  Object.keys(snap).forEach(k=>{ sync.sent[k]=JSON.stringify(snap[k]); });
  sync.dirty={}; sync.pending=0; syncSave();
}

async function supa(path,opts){
  const r=await fetch(SUPA_URL+path, Object.assign({
    headers:{ 'apikey':SUPA_KEY, 'Authorization':'Bearer '+SUPA_KEY,
              'Content-Type':'application/json' } }, opts||{}));
  if(!r.ok) throw new Error('HTTP '+r.status+' '+(await r.text()).slice(0,120));
  const txt=await r.text();
  return txt?JSON.parse(txt):null;
}

/* ---------- push ---------- */
function schedulePush(){ clearTimeout(pushTimer); pushTimer=setTimeout(syncPush,PUSH_MS); }

async function syncPush(){
  if(!sync.on||sync.busy) return;
  const keys=Object.keys(sync.dirty); if(!keys.length) return;
  if(!state.scorer){                                            // viewers never write
    const snap=syncSnapshot();
    Object.keys(snap).forEach(k=>{ sync.sent[k]=JSON.stringify(snap[k]); });
    sync.dirty={}; sync.pending=0; syncSave(); return; }
  sync.busy=true; syncStatus('sync');
  const batch=keys.slice(0,60);
  const items=batch.map(k=>({key:k, data:JSON.parse(sync.dirty[k]), rev:sync.rev[k]}));
  try{
    const res=await supa('/rest/v1/rpc/osl_put',{ method:'POST',
      body:JSON.stringify({items:items, by:sync.device}) });
    const ok={}; (res||[]).forEach(r=>ok[r.out_key]=r.out_rev);
    batch.forEach(k=>{
      if(ok[k]!==undefined){ sync.sent[k]=sync.dirty[k]; sync.rev[k]=ok[k]; delete sync.dirty[k]; }
      else { delete sync.dirty[k]; }     // server holds a newer row — the pull will bring it
    });
    sync.pending=Object.keys(sync.dirty).length;
    sync.lastOk=Date.now(); syncSave(); syncStatus('live');
    if(sync.pending) schedulePush();
  }catch(e){ syncStatus('off_line', String(e.message||e)); }
  finally{ sync.busy=false; }
}

/* ---------- pull ---------- */
async function syncPull(force){
  if(!sync.on||sync.busy) return;
  sync.busy=true; if(sync.status!=='live') syncStatus('sync');
  try{
    const since=(force?null:sync.cursor);
    const q='/rest/v1/osl_live?select=key,data,rev,updated_at&order=updated_at.asc&limit=500'+
      (since?'&updated_at=gt.'+encodeURIComponent(since):'');
    const rows=await supa(q);
    let changed=0, newest=sync.cursor;
    (rows||[]).forEach(r=>{
      if(r.key.indexOf(sync.event+':')!==0) return;
      if(!newest||r.updated_at>newest) newest=r.updated_at;
      if((sync.rev[r.key]||0)>=r.rev) return;                  // we hold this or newer
      if(sync.dirty[r.key]) return;                            // our own edit is still queued
      const parts=r.key.split(':'), kind=parts[1], id=parts.slice(2).join(':');
      let hit=false;
      if(kind==='m')   hit=applyMatch(id,r.data);
      if(kind==='nom' && teamById(id)){ state.nom[id]=r.data||state.nom[id]; hit=true; }
      if(kind==='av'  && teamById(id)){ state.avail[id]=r.data||{}; hit=true; }
      if(kind==='pen' && teamById(id)){ const d=r.data||{};
        if(d && d.pts) state.pen[id]=d; else delete state.pen[id]; hit=true; }
      if(!hit) return;
      sync.rev[r.key]=r.rev; changed++;
    });
    sync.cursor=newest;
    if(changed){
      syncKnockouts();
      try{ localStorage.setItem(STORE_KEY, JSON.stringify({ v:APP_VER, theme:state.theme,
        scorer:state.scorer, pin:state.pin, myTeam:state.myTeam,
        matches:state.matches, nom:state.nom, avail:state.avail, pen:state.pen })); }catch(e){}
      const snap=syncSnapshot();                                // adopt as our baseline
      Object.keys(snap).forEach(k=>{ if(!sync.dirty[k]) sync.sent[k]=JSON.stringify(snap[k]); });
    }
    sync.lastOk=Date.now(); syncSave(); syncStatus('live');
    if(changed && !modal) render();
  }catch(e){ syncStatus('off_line', String(e.message||e)); }
  finally{ sync.busy=false; }
}

function syncStart(){
  sync.on=true; syncSave(); syncStatus('sync');
  clearInterval(pullTimer); pullTimer=setInterval(()=>syncPull(false),PULL_MS);
  syncPull(true).then(()=>{ syncScan(); });
}
function syncStop(){ sync.on=false; clearInterval(pullTimer); pullTimer=null;
  clearTimeout(pushTimer); syncSave(); syncStatus('off'); }

/* Send the whole of this device's state, whatever the revisions say — for the
   device that is seeding the event, or recovering after a wipe elsewhere. */
async function syncPublishAll(){
  if(!sync.on) return toast('Turn live sync on first');
  if(!state.scorer) return toast('Scorer mode only');
  const snap=syncSnapshot();
  Object.keys(snap).forEach(k=>{ sync.rev[k]=(sync.rev[k]||0)+1; sync.dirty[k]=JSON.stringify(snap[k]); });
  sync.pending=Object.keys(sync.dirty).length;
  toast('Publishing '+sync.pending+' rows…');
  while(Object.keys(sync.dirty).length && sync.on){ await syncPush(); await new Promise(r=>setTimeout(r,120)); }
  toast('Published'); if(modal) openModal(settingsModal());
}

    if(A!==TARGET&&B!==TARGET){ state.finalErr='One team must be on '+TARGET+' — that is what ends the match.'; return render(); }
    if(A===TARGET&&B===TARGET){ state.finalErr='Both teams cannot be on '+TARGET+'.'; return render(); }
    if((m.log||[]).length && !confirm('This replaces the score already recorded for this match. Continue?')) return;
    const log=[]; let x=A,y=B;                       // interleave so the running score looks sane
    while(x>0||y>0){ if(x>0){log.push('a');x--;} if(y>0){log.push('b');y--;} }
    m.log=log; m.acked=[GATE1,GATE2]; m.done=true;
    state.finalFor=null; state.finalErr=''; syncKnockouts(); save(); return render(); }

  if((el=g('data-sharematch'))){ const m=state.matches.find(x=>x.id===el.getAttribute('data-sharematch'));
    return shareText(matchText(m)); }
  if(g('data-sharestats')) return shareText(statsText());
  if(g('data-sharetable')) return shareText(ledgerText());

  if((el=g('data-undo'))){ const m=state.matches.find(x=>x.id===el.getAttribute('data-undo'));
    undoPoint(m); return render(); }
  if((el=g('data-reset'))){ const m=state.matches.find(x=>x.id===el.getAttribute('data-reset'));
    if(!confirm('Clear the score for this match? Line-ups are kept.')) return;
    m.log=[]; m.acked=[]; m.done=false; syncKnockouts(); save(); return render(); }
  if((el=g('data-lineup'))){ const m=state.matches.find(x=>x.id===el.getAttribute('data-lineup'));
    return openModal(lineupModal(m)); }
  if((el=g('data-autolineup'))){ const m=state.matches.find(x=>x.id===el.getAttribute('data-autolineup'));
    const ok=[m.a,m.b].map(t=>autoLineup(m,t)); save();
    if(ok.some(x=>!x)) toast('Not enough nominations for a full line-up');
    return openModal(lineupModal(m)); }

  if((el=g('data-cres'))){ const [id,r]=el.getAttribute('data-cres').split('|');
    const m=state.matches.find(x=>x.id===id); m.result=r||null; m.done=!!r; save(); return render(); }

  if((el=g('data-nom'))){ const [tid,sk,pid]=el.getAttribute('data-nom').split('|');
    const err=toggleNom(tid,sk,pid); if(err) toast(err); save(); return render(); }
  if((el=g('data-avail'))){ const [tid,pid,to]=el.getAttribute('data-avail').split('|');
    setAvail(tid,pid,to==='in'); save();
    toast(to==='in'?pName(pid)+' is back in':pName(pid)+' is out — nominations cleared');
    return render(); }
  if((el=g('data-pdf'))){ const w=el.getAttribute('data-pdf');
    toast(w==='all'?'Preparing all eight team sheets…':'Preparing the team sheet…');
    return doPrint(w); }
  if((el=g('data-pensave'))){ const tid=el.getAttribute('data-pensave');
    const pts=($('#penpts_'+tid)||{}).value, note=($('#pennote_'+tid)||{}).value;
    setPen(tid,pts,note); toast(Number(pts)>0?'Penalty applied':'Penalty removed'); return render(); }
  if((el=g('data-pensuggest'))){ const [tid,pts]=el.getAttribute('data-pensuggest').split('|');
    const pr=participation(tid);
    setPen(tid,pts,'§3.1 — '+pr.breach.length+' player'+(pr.breach.length>1?'s':'')+' did not play');
    toast('Suggested penalty applied'); return render(); }
  if((el=g('data-penclear'))){ setPen(el.getAttribute('data-penclear'),0,''); toast('Penalty removed'); return render(); }
  if((el=g('data-auto'))){ autoNominate(el.getAttribute('data-auto')); save(); toast('Nominations filled'); return render(); }
  if((el=g('data-clearnom'))){ const tid=el.getAttribute('data-clearnom');
    if(!confirm('Clear every nomination for this team?')) return;
    state.nom[tid]={PB:[],BM:[],TT:[],CR:[],CH:[]}; save(); return render(); }

  if((el=g('data-scorer'))){
    if(el.getAttribute('data-scorer')==='off'){ state.scorer=false; save(); return openModal(settingsModal()); }
    const v=($('#pinin')||{}).value;
    if(v===state.pin){ state.scorer=true; save();
      if(sync.on){ toast('Scorer mode on — fetching the latest results');
        syncPull(true).then(()=>{ if(modal) openModal(settingsModal()); }); }
      else toast('Scorer mode on');
      return openModal(settingsModal()); }
    toast('Wrong PIN'); return;
  }
  if(g('data-export')){
    const blob=new Blob([JSON.stringify({v:APP_VER,matches:state.matches,nom:state.nom,avail:state.avail},null,1)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download='osl-2026-backup.json'; a.click(); return toast('Backup downloaded');
  }
  if(g('data-csv')){
    const rows=[['Sport','Stage','Round','Court','Time','Team A','Team B','Score A','Score B','Result']];
    state.matches.forEach(m=>{ const s=scoreText(m), r=resultOf(m);
      rows.push([SP[m.sport].name,stageName(m),m.round,m.court,m.time,
        (teamById(m.a)||{}).name||'TBD',(teamById(m.b)||{}).name||'TBD',s[0],s[1],
        r?(r==='d'?'Draw':(teamById(r==='a'?m.a:m.b)||{}).name):'']); });
    const csv=rows.map(r=>r.map(c=>'"'+String(c==null?'':c).replace(/"/g,'""')+'"').join(',')).join('\n');
    const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
    a.download='osl-2026-results.csv'; a.click(); return toast('CSV downloaded');
  }
  if(g('data-import')){
    const i=document.createElement('input'); i.type='file'; i.accept='.json';
    i.onchange=()=>{ const f=i.files[0]; if(!f) return; const rd=new FileReader();
      rd.onload=()=>{ try{ const d=JSON.parse(rd.result);
          localStorage.setItem(STORE_KEY,JSON.stringify(Object.assign({},d,{theme:state.theme,pin:state.pin})));
          location.reload(); }catch(err){ toast('That file could not be read'); } };
      rd.readAsText(f); };
    i.click(); return;
  }
  if(g('data-wipe')){ if(!confirm('Delete every score and nomination on this device?')) return;
    localStorage.removeItem(STORE_KEY); location.reload(); }
});

document.addEventListener('input',e=>{
  const el=e.target;
  if(el.tagName==='INPUT' && el.hasAttribute('data-final')){
    if(el.getAttribute('data-final')==='a') state.finalA=el.value; else state.finalB=el.value;
  }
});

document.addEventListener('change',e=>{
  const el=e.target; let a;
  if((a=el.getAttribute('data-lp'))){ const [id,tid,slot]=a.split('|');
    const m=state.matches.find(x=>x.id===id);
    m.lineup=Object.assign({},m.lineup); const arr=(m.lineup[tid]||[]).slice();
    while(arr.length<6) arr.push(null);
    arr[+slot]=el.value||null; m.lineup[tid]=arr; save(); return openModal(lineupModal(m)); }
  if((a=el.getAttribute('data-cb'))){ const [id,bi,side]=a.split('|');
    const m=state.matches.find(x=>x.id===id);
    m.boards[+bi][side]=el.value===''?null:Number(el.value);
    m.done=carromPlayed(m); save(); return render(); }
  if((a=el.getAttribute('data-cp'))){ const [id,tid,bi,si]=a.split('|');
    const m=state.matches.find(x=>x.id===id); m.pairs=m.pairs||{};
    const p=m.pairs[tid]||{}; const key='b'+(+bi+1); const arr=(p[key]||[]).slice();
    while(arr.length<2) arr.push(null); arr[+si]=el.value||null;
    p[key]=arr; m.pairs[tid]=p; save(); return; }
  if((a=el.getAttribute('data-chp'))){ const [id,tid]=a.split('|');
    const m=state.matches.find(x=>x.id===id); m.players=m.players||{};
    m.players[tid]=el.value||null; save(); return; }
  if(el.getAttribute('data-myteam')!==null && el.hasAttribute('data-myteam')){
    state.myTeam=el.value||null; save(); return openModal(settingsModal()); }
});

/* ============================ BOOT ============================ */
syncLoad();
load();
render();
if(sync.on){ if(!Object.keys(sync.sent).length) syncBaseline(); syncStart(); }
else syncStatus('off');
/* Come back from a locked screen or a backgrounded tab with the latest scores. */
document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&sync.on) syncPull(false); });
setInterval(()=>{ if(document.getElementById('syncstat')) syncChrome(); },1000);
window.addEventListener('online',()=>{ if(sync.on){ syncPull(false); schedulePush(); } });
</script>
</body>
</html>
